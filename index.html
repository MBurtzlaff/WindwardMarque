function openSailorLevelUp(){ if(!G||!(G.pendingSailorLevels||[]).length) return;
  if(document.querySelector('.sailor-levelup')) return;
  const sid=G.pendingSailorLevels[0]; const s=findSailor(sid);
  if(!s){ G.pendingSailorLevels.shift(); if(G.pendingSailorLevels.length) openSailorLevelUp(); return; }
  if(crewAutoPerk()){ applySailorPerkAuto(s); G.pendingSailorLevels=G.pendingSailorLevels.filter(id=>id!==s.id); if(G.pendingSailorLevels.length) openSailorLevelUp(); return; }
  const picks=sailorPerkChoices(s);
  const html=`<h2>${escapeHtml(sailorName(s))} — rank ${s.level}</h2>
    <p>They have learned a hard lesson. Choose one craft. Each one costs them something.</p>
    <div class="offers">${picks.map(p=>`<button class="offer" data-spid="${p.id}"><h3>${p.name}</h3><p>${p.desc}</p><p class="tradeoff">You give up: ${p.down}</p></button>`).join('')}</div>
    <div class="row"><button class="btn" id="sl-auto">Let them choose</button></div>`;
  const m=modal(html,'sailor-levelup');
  m.querySelectorAll('.offer').forEach(btn=>btn.onclick=()=>{ applySailorPerk(s, btn.dataset.spid); closeModal(m); toast(sailorName(s)+' made their choice.'); if((G.pendingSailorLevels||[]).length) openSailorLevelUp(); else renderAll(); });
  m.querySelector('#sl-auto').onclick=()=>{ applySailorPerkAuto(s); closeModal(m); if((G.pendingSailorLevels||[]).length) openSailorLevelUp(); else renderAll(); };
}

function offerPrizeJoiners(nation){ const room=hammockRoom(); if(room<=0) return;
  const n=Math.min(room, 2+Math.floor(Math.random()*2));
  const list=prizeCrewOffers({ }, nation, n);
  if(!list.length) return;
  const html=`<h2>They ask to join</h2>
    <p>Some of the captured company would rather sail with you than take their chances ashore. They are unique people — if they die later, they are gone.</p>
    <div class="crewlist">${list.map(s=>recruitCardHtml(s, { id:'prize', nation:nation||'pirate' }).replace('data-hire=','data-pjoin=')).join('')}</div>
    <div class="row"><button class="btn" id="pj-skip">Turn them away</button></div>`;
  const m=modal(html,'prizejoin wide');
  m.querySelector('#pj-skip').onclick=()=>closeModal(m);
  m.querySelectorAll('[data-pjoin]').forEach(b=>b.onclick=()=>{
    const s=list.find(x=>x.id===b.dataset.pjoin); if(!s) return;
    const fee=Math.max(4, Math.round(recruitPrice(s, { id:'prize', nation })*0.45));
    if(G.player.gold<fee){ toast('Not enough gold for their signing fee.'); return; }
    if(hammockRoom()<=0){ toast('No hammocks left.'); return; }
    G.player.gold-=fee; s.hireCost=fee; s.wage=recruitWage(s);
    if(!assignToRoom(s)){ toast('No room.'); return; }
    G.crew.push(s); syncAllNamedCrew();
    addLog(`${sailorName(s)} turns their coat and signs on (${fee} gold).`);
    b.closest('.reccard').remove();
    if(!m.querySelector('[data-pjoin]')) closeModal(m);
    renderAll();
  });
}

function openHideout(){ if(!G) return; hideBanner(); ensureHideout();
  const f=playerFleet();
  if(!hideoutNearFleet(f) && !G.hideout.claimed){ toast('Sail to the cove marker south of the middle islets to claim it.'); return; }
  if(!G.hideout.claimed){ if(!claimHideout()) return; }
  document.getElementById('hideout').classList.remove('hidden');
  HO_SEL=HO_SEL||'dock';
  renderHideout();
  requestAnimationFrame(()=>{ layoutHideout(); drawHideout(); setupHideoutInput(); });
}
function closeHideout(){ const el=document.getElementById('hideout'); if(el) el.classList.add('hidden');
  const f=playerFleet(); if(f) MAPV.range=tilesInRange(G.map,f.x,f.y,f.mp,G.player,G.wind);
  renderAll(); try{ mobBackUpdate(); }catch(e){} }

function hideoutBuildingCard(id){ const def=HIDEOUT_BUILDINGS[id]; if(!def) return '';
  const built=hideoutBuilt(id); const can=hideoutCanBuild(id);
  const taken=def.either?hideoutEitherTaken(def.either):null;
  const eitherNote=def.either?`<div class="either">Either-or: choose this or ${HIDEOUT_EITHER[def.either].filter(x=>x!==id).map(x=>HIDEOUT_BUILDINGS[x].name).join(' / ')}. You cannot have both.</div>`:'';
  let status='';
  if(built) status='<span class="good">Standing</span>';
  else if(G.hideout.building&&G.hideout.building.id===id) status=`<span>Building — ${G.hideout.building.left} day${G.hideout.building.left===1?'':'s'} left</span>`;
  else if(taken) status=`<span class="dim">Closed — you chose ${HIDEOUT_BUILDINGS[taken].name}</span>`;
  else status=`<span>${def.cost} gold · ${def.wood||0} timber · ${def.days} days</span>`;
  return `<button class="hcard ${HO_SEL===id?'on':''} ${built?'built':''}" data-hsel="${id}">
    <div class="gh"><b>${def.name}</b> ${status}</div>
    <div class="gp">${def.desc}</div>${eitherNote}
  </button>`; }

function renderHideout(){ const el=document.getElementById('hideout'); if(!el||el.classList.contains('hidden')||!G||!G.hideout) return;
  const h=G.hideout; const def=HIDEOUT_BUILDINGS[HO_SEL]; const can=def?hideoutCanBuild(HO_SEL):{ok:false};
  const ashore=livingPlayerCrew().filter(s=>s.shipId==='hideout');
  const groups=[
    ['Core','The first investments',['dock','warehouse','tavern','infirmary','training']],
    ['Dock work','Choose one path once the dock is up',['careening','slipway']],
    ['Arms','Choose an armory or a foundry — not both',['armory','foundry']],
    ['Eyes & walls','Lookouts or a hidden channel; then guns on the shore',['palisade','batteries','lookout','channel']],
    ['Income','A small trickle once you have something to trade',['market','smugglers','fishery']]
  ];
  const wh=h.warehouse||{};
  const whKeys=GOODS.filter(g=>(wh[g]||0)>0);
  el.innerHTML=`<div class="screen panel hidscr">
    <div class="scr-head"><h1>${escapeHtml(h.name)}</h1><button class="btn" id="ho-x">Leave</button></div>
    <p class="dim">A hidden cove on its own islet. Gold and timber raise buildings over days. Several works are either-or — pick a path, the other closes.</p>
    <p>Gold ${G.player.gold} · Timber ${h.wood||0} · Defense ${hideoutDefenseScore()} · ${hideoutIncomeHint()}${h.building?` · Raising the ${h.building.name} (${h.building.left}d)`:''}${h.shipBuilding?` · Hull on the slip (${h.shipBuilding.left}d)`:''}</p>
    <div class="hcanvas-wrap">
      <canvas id="hcv"></canvas>
      <div class="hzoom" id="h-zoom"><button class="btn small" id="hz-out">－</button><button class="btn small" id="hz-in">＋</button><button class="btn small" id="hz-fit">Fit</button></div>
    </div>
    <div class="row" style="justify-content:flex-start;margin:8px 0">
      ${hideoutBuilt('dock')?`<button class="btn" id="ho-rep">Repair fleet here</button>`:''}
      ${hideoutBuilt('tavern')||true?`<button class="btn" id="ho-hire">Recruit at the cove</button>`:''}
      ${hideoutBuilt('training')?`<button class="btn" id="ho-train">Train here</button>`:''}
      ${hideoutBuilt('slipway')?`<button class="btn" id="ho-sloop">Lay down a sloop</button><button class="btn" id="ho-schooner">Lay down a schooner</button>`:''}
    </div>
    ${def?`<div class="hdetail">
      <h3>${def.name}</h3>
      <p>${def.desc}</p>
      ${def.either?`<p class="either">This is an either-or choice with ${HIDEOUT_EITHER[def.either].filter(x=>x!==HO_SEL).map(x=>HIDEOUT_BUILDINGS[x].name).join(' or ')}. You cannot come back later and build the other.</p>`:''}
      <div class="row" style="justify-content:flex-start">
        ${hideoutBuilt(HO_SEL)?'<span class="good">Already standing.</span>':(h.building&&h.building.id===HO_SEL?`<span>Work underway — ${h.building.left} days left.</span>`:`<button class="btn primary" id="ho-build" ${can.ok?'':'disabled'}>Build — ${def.cost} gold, ${def.wood||0} timber, ${def.days} days</button>`)}
        ${!can.ok&&!hideoutBuilt(HO_SEL)&&!(h.building&&h.building.id===HO_SEL)?`<span class="dim">${can.why||''}</span>`:''}
      </div>
    </div>`:''}
    ${groups.map(([title,blurb,ids])=>`<h3>${title}</h3><p class="dim">${blurb}</p><div class="hlist">${ids.map(hideoutBuildingCard).join('')}</div>`).join('')}
    <h3>Hands ashore (${ashore.length})</h3>
    <p class="dim">Sailors left here are safe from battle. They can heal${hideoutBuilt('infirmary')?' quickly in the infirmary':''} and stay off a cruise you do not want them on.</p>
    <div class="crewlist">${ashore.length?ashore.map(s=>sailorRowHtml(s)).join(''):'<p class="dim">No one is ashore. Open the roster and send favourites here before a hard fight.</p>'}</div>
    ${hideoutBuilt('warehouse')?`<h3>Warehouse</h3>
      <p class="dim">Loot stored here will not go down with a ship.</p>
      ${GOODS.map(g=>{ const aboard=((flagshipOf(playerFleet())||{}).cargo||{})[g]||0; const here=wh[g]||0;
        return `<div class="goodcard"><div class="gh"><b>${GOOD_INFO[g].name}</b><span>Aboard ${aboard} · Stored ${here}</span></div>
          <div class="mktbtns">
            <button class="btn small" data-stow="${g}" ${aboard?'':'disabled'}>Store 1</button>
            <button class="btn small" data-take="${g}" ${here?'':'disabled'}>Take 1</button>
          </div></div>`; }).join('')}`:''}
  </div>`;
  el.querySelector('#ho-x').onclick=()=>closeHideout();
  const bd=document.getElementById('ho-build'); if(bd) bd.onclick=()=>startHideoutBuild(HO_SEL);
  el.querySelectorAll('[data-hsel]').forEach(b=>b.onclick=()=>{ HO_SEL=b.dataset.hsel; renderHideout(); });
  const rp=document.getElementById('ho-rep'); if(rp) rp.onclick=()=>doRepair(hideoutPort());
  const hh=document.getElementById('ho-hire'); if(hh) hh.onclick=()=>openHideoutHire();
  const ht=document.getElementById('ho-train'); if(ht) ht.onclick=()=>openHideoutTrain();
  const hs=document.getElementById('ho-sloop'); if(hs) hs.onclick=()=>startHideoutShip('sloop');
  const hc=document.getElementById('ho-schooner'); if(hc) hc.onclick=()=>startHideoutShip('schooner');
  el.querySelectorAll('[data-stow]').forEach(b=>b.onclick=()=>storeGoodAtHideout(b.dataset.stow,1));
  el.querySelectorAll('[data-take]').forEach(b=>b.onclick=()=>takeGoodFromHideout(b.dataset.take,1));
  el.querySelectorAll('.sailorrow[data-sid]').forEach(b=>b.onclick=()=>openCrew(b.dataset.sid));
  const zi=document.getElementById('hz-in'); if(zi) zi.onclick=()=>{ HV.z=Math.min(2.4,(HV.z||1)*1.15); drawHideout(); };
  const zo=document.getElementById('hz-out'); if(zo) zo.onclick=()=>{ HV.z=Math.max(0.7,(HV.z||1)/1.15); if(HV.z<=1){ HV.panX=0; HV.panY=0; } drawHideout(); };
  const zf=document.getElementById('hz-fit'); if(zf) zf.onclick=()=>{ HV.z=1; HV.panX=0; HV.panY=0; drawHideout(); toast('Cove fitted'); };
  layoutHideout(); drawHideout(); setupHideoutInput();
  try{ mobBackUpdate(); }catch(e){} }

function openHideoutHire(){ const port=hideoutPort(); const pool=ensureHirePool(port);
  const html=`<h2>Hands at the cove</h2>
    <p>${hideoutBuilt('tavern')?'The tavern draws a better crowd.':'A few wanderers found the cove. A tavern would bring more, and better, recruits.'}</p>
    <div class="crewlist">${pool.map(s=>recruitCardHtml(s,port)).join('')||'<p class="dim">No one is looking for a berth today.</p>'}</div>
    <div class="row"><button class="btn" id="hh-x">Close</button></div>`;
  const m=modal(html,'wide');
  m.querySelector('#hh-x').onclick=()=>closeModal(m);
  m.querySelectorAll('[data-hire]').forEach(b=>b.onclick=()=>{ const s=pool.find(x=>x.id===b.dataset.hire); if(s){ hireRecruit(port,s); closeModal(m); openHideoutHire(); } });
}
function openHideoutTrain(){ const port=hideoutPort(); const offers=portTrainOffer(port);
  const living=livingPlayerCrew().filter(s=>s.status==='ok'&&(s.shipId==='hideout'||true));
  const html=`<h2>Training yard</h2>
    <p>Cheaper drills than the colonial ports${hideoutBuilt('training')?'':''}.</p>
    <label>Train <select id="ht-who">${living.map(s=>`<option value="${s.id}">${escapeHtml(sailorName(s))}</option>`).join('')}</select></label>
    <div class="ups">${offers.map(o=>`<button class="btn upbtn" data-htr="${o.skill}"><b>${o.name}</b><span>${o.gold} gold · ${o.days} days${o.specialized?' · favoured here':''}</span></button>`).join('')}</div>
    <div class="row"><button class="btn" id="ht-x">Close</button></div>`;
  const m=modal(html);
  m.querySelector('#ht-x').onclick=()=>closeModal(m);
  m.querySelectorAll('[data-htr]').forEach(b=>b.onclick=()=>{
    const s=findSailor(document.getElementById('ht-who').value);
    const offer=offers.find(o=>o.skill===b.dataset.htr);
    if(s&&offer){ startCrewTraining(s,offer); closeModal(m); if(typeof renderHideout==='function') renderHideout(); }
  });
}

function layoutHideout(){ const cv=document.getElementById('hcv'); if(!cv) return; HV.cv=cv; HV.ctx=cv.getContext('2d');
  const wrap=cv.parentElement; const w=wrap?wrap.clientWidth:Math.min(720, window.innerWidth-24);
  const h=Math.max(220, Math.min(340, Math.round(w*0.48)));
  const dpr=Math.min(2, window.devicePixelRatio||1);
  cv.width=Math.max(1,w*dpr); cv.height=Math.max(1,h*dpr); cv.style.width=w+'px'; cv.style.height=h+'px'; HV.dpr=dpr; }
function hideoutWorldFromScreen(sx,sy){ const z=HV.z||1, dpr=HV.dpr||1; const cx=(HV.cv?HV.cv.width/dpr:0)/2, cy=(HV.cv?HV.cv.height/dpr:0)/2;
  return { x:(sx-cx)/z+cx-HV.panX, y:(sy-cy)/z+cy-HV.panY }; }
function hideoutPlotAt(sx,sy){ const w=hideoutWorldFromScreen(sx,sy); const scale=hideoutScale();
  for(const id of Object.keys(HIDEOUT_PLOTS)){ const p=HIDEOUT_PLOTS[id]; const x=p.x*scale.k+scale.ox, y=p.y*scale.k+scale.oy, ww=p.w*scale.k, hh=p.h*scale.k;
    if(w.x>=x&&w.y>=y&&w.x<=x+ww&&w.y<=y+hh) return id; }
  return null; }
function hideoutScale(){ const dpr=HV.dpr||1; const W=(HV.cv?HV.cv.width/dpr:720), H=(HV.cv?HV.cv.height/dpr:320);
  const k=Math.min(W/740, H/420); return { k, ox:(W-740*k)/2, oy:(H-420*k)/2, W, H }; }

function drawHideout(){ if(!HV.cv||!HV.ctx||!G||!G.hideout) return;
  const ctx=HV.ctx, cv=HV.cv, dpr=HV.dpr||1;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const W=cv.width/dpr, H=cv.height/dpr;
  ctx.clearRect(0,0,W,H);
  ctx.save(); ctx.translate(W/2,H/2); ctx.scale(HV.z||1,HV.z||1); ctx.translate(-W/2+HV.panX,-H/2+HV.panY);
  const sea=ctx.createLinearGradient(0,0,W,H); sea.addColorStop(0,'#0b3c4c'); sea.addColorStop(1,'#0a2a36');
  ctx.fillStyle=sea; ctx.fillRect(-40,-40,W+80,H+80);
  const sc=hideoutScale();
  // island
  ctx.fillStyle='#d7c07a'; ctx.beginPath(); ctx.ellipse(sc.ox+370*sc.k, sc.oy+230*sc.k, 300*sc.k, 160*sc.k, -0.15, 0, 7); ctx.fill();
  ctx.fillStyle='#3a8a40'; ctx.beginPath(); ctx.ellipse(sc.ox+370*sc.k, sc.oy+220*sc.k, 250*sc.k, 130*sc.k, -0.15, 0, 7); ctx.fill();
  // cove water bite
  ctx.fillStyle='#1a5a68'; ctx.beginPath(); ctx.ellipse(sc.ox+200*sc.k, sc.oy+380*sc.k, 160*sc.k, 70*sc.k, 0.1, 0, 7); ctx.fill();
  if(typeof drawPalm==='function'){ drawPalm(ctx, sc.ox+160*sc.k, sc.oy+150*sc.k, 40*sc.k); drawPalm(ctx, sc.ox+500*sc.k, sc.oy+140*sc.k, 46*sc.k); }
  for(const id of Object.keys(HIDEOUT_PLOTS)){ const p=HIDEOUT_PLOTS[id]; const def=HIDEOUT_BUILDINGS[id];
    const x=p.x*sc.k+sc.ox, y=p.y*sc.k+sc.oy, ww=p.w*sc.k, hh=p.h*sc.k;
    const built=hideoutBuilt(id); const building=G.hideout.building&&G.hideout.building.id===id;
    const taken=def.either&&hideoutEitherTaken(def.either)&&hideoutEitherTaken(def.either)!==id;
    ctx.fillStyle=built?'rgba(40,90,50,0.82)':building?'rgba(120,90,30,0.8)':taken?'rgba(30,30,30,0.45)':(HO_SEL===id?'rgba(80,60,20,0.8)':'rgba(20,30,28,0.62)');
    ctx.strokeStyle=HO_SEL===id?'#ffe08a':built?'#7fe0a0':taken?'#666': '#c9a227';
    ctx.lineWidth=HO_SEL===id?2.4:1.4;
    roundRect(ctx,x,y,ww,hh,6); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#f3ead4'; ctx.font=`bold ${Math.max(10, Math.round(11*sc.k*1.1))}px Georgia`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(def.name, x+ww/2, y+hh/2);
    if(building){ const left=G.hideout.building.left, tot=G.hideout.building.total||left; ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(x+6,y+hh-12,ww-12,6);
      ctx.fillStyle='#e8c36a'; ctx.fillRect(x+6,y+hh-12,(ww-12)*clamp(1-left/Math.max(1,tot),0,1),6); }
  }
  ctx.restore(); }

function setupHideoutInput(){ const cv=HV.cv; if(!cv||cv.dataset.hin==='1') return; cv.dataset.hin='1';
  cv.addEventListener('click',e=>{ if(performance.now()<(HV.suppress||0)) return;
    const r=cv.getBoundingClientRect(); const id=hideoutPlotAt(e.clientX-r.left, e.clientY-r.top);
    if(id){ HO_SEL=id; renderHideout(); } });
  const P=new Map(); let g=null;
  const two=()=>{ const [a,b]=[...P.values()]; return {d:Math.hypot(a.x-b.x,a.y-b.y)||1}; };
  cv.addEventListener('pointerdown',e=>{ if(e.pointerType!=='touch') return; try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(P.size===1) g={mode:'tap',x:e.clientX,y:e.clientY,px:HV.panX,py:HV.panY};
    else if(P.size===2){ const t=two(); g={mode:'pinch',d0:t.d,z0:HV.z||1}; } },{passive:true});
  cv.addEventListener('pointermove',e=>{ if(!P.has(e.pointerId)) return; P.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(!g) return;
    if(g.mode==='tap'&&Math.hypot(e.clientX-g.x,e.clientY-g.y)>10) g.mode='pan';
    if(g.mode==='pan'){ const z=HV.z||1; HV.panX=g.px+(e.clientX-g.x)/z; HV.panY=g.py+(e.clientY-g.y)/z; HV.suppress=performance.now()+400; drawHideout(); }
    else if(g.mode==='pinch'&&P.size>=2){ const t=two(); HV.z=Math.max(0.7,Math.min(2.4,g.z0*t.d/g.d0)); HV.suppress=performance.now()+400; drawHideout(); } },{passive:true});
  const up=e=>{ P.delete(e.pointerId); if(P.size===0) g=null; else if(P.size===1&&g&&g.mode==='pinch'){ const [p]=[...P.values()]; g={mode:'pan',x:p.x,y:p.y,px:HV.panX,py:HV.panY}; } };
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
}
