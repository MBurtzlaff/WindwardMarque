// Rival captains and navy patrols
function runAIDay(){ if(!G) return; const you=playerFleet();
  G.report=[];
  for(const f of G.fleets){ if(f.dead||f.owner==='player') continue;
    try{ aiFleetTurn(f, you); }catch(e){ console.error('ai',e); }
  }
  if(G.report.length){ const important=G.report.slice(0,8);
    addLog('On the horizon: '+important.join(' · ')); }
}

function aiFleetTurn(f, you){ f.mp=f.mpMax||fleetSpeed(f);
  const cap=f.captain||{skills:{navigation:1}};
  const aggro=(DIFF[G.difficulty]||DIFF.normal).aiAggro;
  const hostile = you && (f.nation==='pirate' || repStanding(f.nation)==='hostile' || (G.player.marque && NATIONS[G.player.marque].rival===f.nation));
  let target=null;
  if(f.role==='navy' && you && !you.dead && hostile){
    const d=Math.abs(you.x-f.x)+Math.abs(you.y-f.y);
    if(d <= 10+Math.round(2*aggro)) target={x:you.x,y:you.y,kind:'hunt'};
  }
  if(f.role==='pirate' && you && !you.dead){
    const d=Math.abs(you.x-f.x)+Math.abs(you.y-f.y);
    if(d<=8 && Math.random()<0.55*aggro) target={x:you.x,y:you.y,kind:'hunt'};
  }
  if(f.role==='merchant' && you && !you.dead){
    const d=Math.abs(you.x-f.x)+Math.abs(you.y-f.y);
    if(d<=3){ // flee opposite
      const dx=Math.sign(f.x-you.x)|| (Math.random()<0.5?1:-1);
      const dy=Math.sign(f.y-you.y);
      target={x:clamp(f.x+dx*4,1,MAP_W-2), y:clamp(f.y+dy*4,1,MAP_H-2), kind:'flee'};
    }
  }
  if(!target){ const home=G.map.ports.find(p=>p.id===f.home)||pick(G.map.ports);
    let dest=home;
    if(f.role==='merchant'){ const others=G.map.ports.filter(p=>p.nation===f.nation||p.nation==='pirate'); dest=pick(others.length?others:G.map.ports); }
    if(f.role==='navy' || f.role==='pirate'){
      // patrol: wander toward a nearby sea tile or home
      if(Math.random()<0.45) dest=home;
      else dest={ x:clamp(f.x+irnd(-4,4),1,MAP_W-2), y:clamp(f.y+irnd(-4,4),1,MAP_H-2) };
    }
    target={x:dest.x, y:dest.y, kind:'sail'};
    // merchants dock conceptually — if they stand on a non-walkable dest (port), path onto it then leave next day
  }
  // if dest is land, snap to nearby sea
  if(!walkable(G.map,target.x,target.y)){ const s=nearestSea(target.x,target.y); if(s){ target.x=s.x; target.y=s.y; } else return; }
  const pr=findPath(G.map,f.x,f.y,target.x,target.y,cap,G.wind,80);
  if(!pr||!pr.path.length) return;
  const seen0=you&&Math.abs(you.x-f.x)+Math.abs(you.y-f.y)<=SIGHT;
  let moved=0;
  for(const step of pr.path){ const cost=stepCost(G.map,f.x,f.y,step.x,step.y,cap,G.wind); if(f.mp<cost) break;
    f.mp-=cost; f.x=step.x; f.y=step.y; moved++;
    if(you && !you.dead && f.x===you.x && f.y===you.y){
      // they ran into the player
      if(f.role==='merchant' && target.kind!=='hunt'){ // bounce merchant off
        nudgeFleet(f,you); break; }
      G.report.push(`${NATIONS[f.nation].adj} ${f.role} ${flagshipOf(f)?flagshipOf(f).name:''} intercepted you!`);
      beginEncounter(f); return; }
  }
  const seen1=you&&Math.abs(you.x-f.x)+Math.abs(you.y-f.y)<=SIGHT;
  if(moved && (seen0||seen1) && you){ const sh=flagshipOf(f); G.report.push(`A ${NATIONS[f.nation].adj} ${f.role}${sh?' “'+sh.name+'”':''} is under sail.`); }
}

function nearestSea(x,y){ for(let r=0;r<6;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
    if(Math.abs(dx)+Math.abs(dy)!==r && r>0) continue; const nx=x+dx,ny=y+dy; if(walkable(G.map,nx,ny)) return {x:nx,y:ny}; } return null; }
function nudgeFleet(f, other){ for(const d of DIRS4){ const nx=f.x+d.x,ny=f.y+d.y; if(walkable(G.map,nx,ny)&&!fleetAt(nx,ny,f)&&!portAt(nx,ny)){ f.x=nx; f.y=ny; return; } } }

// ---- 09_save.js ----
// Save / load / autosave / export / import — never wiped by preference reset
function serializeGame(){ if(!G) return null;
  return { format:SAVE_FORMAT, version:1, gameVersion:GAME_VERSION, savedAt:Date.now(), game:G }; }

function reviveGame(obj){ if(!obj) throw new Error('Empty save.');
  const data=obj.game?obj: { game:obj, version:1 };
  if(data.format && data.format!==SAVE_FORMAT) throw new Error('Not a Windward Marque save.');
  const g=data.game; if(!g||!g.map||!g.player||!g.fleets) throw new Error('Save is missing voyage data.');
  // migrations go here as versions grow; old saves must still load
  if(!g.version) g.version='0.1.0';
  if(typeof migrateCrewIfNeeded==='function') migrateCrewIfNeeded(g);
  if(typeof ensureSupplies==='function') ensureSupplies(g);
  if(typeof ensureHideout==='function') ensureHideout(g);
  if(typeof rebuildUsedNames==='function') rebuildUsedNames(g);
  G=g; pendingLevelUps=0; B=null; CUR_PORT=null;
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('port').classList.add('hidden');
  document.getElementById('captain').classList.add('hidden');
  document.getElementById('fleet').classList.add('hidden');
  document.getElementById('combat').classList.add('hidden');
  const cr=document.getElementById('crew'); if(cr) cr.classList.add('hidden');
  const ho=document.getElementById('hideout'); if(ho) ho.classList.add('hidden');
  const f=playerFleet(); if(f){ MAPV.range=tilesInRange(G.map,f.x,f.y,f.mp,G.player,G.wind); centerOnFleet(f); }
  renderAll(); return G; }

function saveGame(silent){ if(!G){ toast('No voyage to save.'); return false; }
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(serializeGame())); if(!silent) toast('Voyage saved on this device.'); return true; }
  catch(e){ toast('Could not save: '+(e.message||e)); return false; } }

function loadGame(raw){ try{
    const s=raw||localStorage.getItem(SAVE_KEY)||localStorage.getItem(AUTO_KEY);
    if(!s){ toast('No saved voyage on this device.'); return false; }
    reviveGame(JSON.parse(s)); toast('Voyage loaded.'); return true;
  }catch(e){ toast('Could not load: '+(e.message||e)); return false; } }

function autoSave(){ if(!G) return; try{ const blob=JSON.stringify(serializeGame()); localStorage.setItem(AUTO_KEY, blob);
    const idx=autoList(); idx.unshift({ key:AUTO_KEY+'_'+Date.now(), ts:Date.now(), day:G.day, captain:G.player.name, gold:G.player.gold });
    // store last 3 snapshots
    try{ localStorage.setItem(idx[0].key, blob); }catch(e){}
    while(idx.length>3){ const old=idx.pop(); try{ localStorage.removeItem(old.key); }catch(e){} }
    autoWriteIdx(idx);
  }catch(e){ console.warn('autosave',e); } }

function autoList(){ try{ return JSON.parse(localStorage.getItem(AUTO_IDX)||'[]'); }catch(e){ return []; } }
function autoWriteIdx(idx){ try{ localStorage.setItem(AUTO_IDX, JSON.stringify(idx)); }catch(e){} }

function openLoadMenu(){ const man=(()=>{ try{ const s=localStorage.getItem(SAVE_KEY); return s?JSON.parse(s):null; }catch(e){ return null; } })();
  const autos=autoList().map(m=>{ let data=null; try{ data=JSON.parse(localStorage.getItem(m.key)); }catch(e){} return {...m,data}; });
  const row=(label, obj, key)=>{ if(!obj||!obj.game) return '';
    const g=obj.game; return `<button class="btn loadrow" data-k="${key}"><b>${label}</b><span class="dim">Day ${g.day} · ${escapeHtml(g.player.name)} · ${g.player.gold} gold</span></button>`; };
  const html=`<h2>Load a voyage</h2>
    <div class="loadlist">
      ${row('Manual save', man, 'manual')||'<p class="dim">No manual save yet.</p>'}
      ${autos.map((a,i)=>row('Autosave '+new Date(a.ts).toLocaleString(), a.data, 'auto-'+i)).join('')||'<p class="dim">No autosaves yet.</p>'}
    </div>
    <p class="dim">Export makes a backup file. Import asks before replacing anything. Saves survive game updates.</p>
    <div class="row">
      <button class="btn" id="sv-export">⬆ Export saves</button>
      <button class="btn" id="sv-import">⬇ Import saves</button>
      <button class="btn" id="sv-close">Close</button>
    </div>`;
  const m=modal(html,'loadmenu');
  m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k; let obj=null;
    if(k==='manual') obj=man; else { const i=+k.slice(5); obj=autos[i]&&autos[i].data; }
    if(obj){ closeModal(m); reviveGame(obj); toast('Voyage loaded.'); }
  });
  m.querySelector('#sv-export').onclick=()=>downloadSaveBundle();
  m.querySelector('#sv-import').onclick=()=>pickSaveFile();
  m.querySelector('#sv-close').onclick=()=>closeModal(m);
}

function collectSaveBundle(){ const autos=autoList().map(m=>{ let data=null; try{ data=JSON.parse(localStorage.getItem(m.key)); }catch(e){} return {...m, data}; }).filter(m=>m.data);
  let manual=null; try{ const s=localStorage.getItem(SAVE_KEY); if(s) manual=JSON.parse(s); }catch(e){}
  return { format:BUNDLE_FORMAT, version:1, exportedAt:Date.now(), manual, autosaves:autos }; }

function downloadSaveBundle(){ const bundle=collectSaveBundle(); if(!bundle.manual && !bundle.autosaves.length){ toast('No saves to export.'); return; }
  const blob=new Blob([JSON.stringify(bundle)],{type:'application/json'}); const name='windward-marque-saves-'+new Date().toISOString().slice(0,10)+'.json';
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; a.rel='noopener';
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },1500);
  try{ if(navigator.share&&navigator.canShare){ const f=new File([blob],name,{type:'application/json'}); if(navigator.canShare({files:[f]})) navigator.share({files:[f],title:GAME_TITLE+' saves'}).catch(()=>{}); } }catch(e){}
  toast('Save backup ready: '+name); }

function importSaveBundle(obj){ if(!obj||obj.format!==BUNDLE_FORMAT||!obj.version) throw new Error('Not a Windward Marque save backup.');
  if(!obj.manual && !(obj.autosaves&&obj.autosaves.length)) throw new Error('Backup has no saves in it.');
  const nMan=obj.manual?1:0, nAuto=(obj.autosaves||[]).length;
  return new Promise((resolve,reject)=>{
    const m=modal(`<h2>Import saves?</h2><p>This backup has <b>${nMan}</b> manual save and <b>${nAuto}</b> autosave(s).</p>
      <p class="bad">Importing will replace your current manual save and autosave list on this device. Export a backup first if you are unsure.</p>
      <div class="row"><button class="btn" id="im-cancel">Cancel</button><button class="btn primary" id="im-ok">Import</button></div>`);
    m.querySelector('#im-cancel').onclick=()=>{ closeModal(m); reject(new Error('cancelled')); };
    m.querySelector('#im-ok').onclick=()=>{ try{
      if(obj.manual) localStorage.setItem(SAVE_KEY, JSON.stringify(obj.manual));
      const old=autoList(); for(const a of old) try{ localStorage.removeItem(a.key); }catch(e){}
      const idx=[]; for(const a of (obj.autosaves||[])){ if(!a||!a.data) continue; const key=a.key||('wm_autosave_imp_'+Date.now()+'_'+Math.random().toString(36).slice(2,7));
        localStorage.setItem(key, JSON.stringify(a.data)); idx.push({key, ts:a.ts||Date.now(), day:a.day||1, captain:a.captain||'—', gold:a.gold||0}); }
      autoWriteIdx(idx); closeModal(m); toast('Saves imported.'); resolve(true); }catch(e){ closeModal(m); reject(e); } };
  }); }

function pickSaveFile(){ const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=async()=>{ const f=inp.files&&inp.files[0]; if(!f) return; try{ const txt=await f.text(); const obj=JSON.parse(txt); await importSaveBundle(obj); try{ openLoadMenu(); }catch(_){} }
    catch(e){ if(e&&e.message==='cancelled') return; toast('Import failed: '+(e.message||e)); } };
  inp.click(); }

function hasSave(){ try{ return !!(localStorage.getItem(SAVE_KEY)||localStorage.getItem(AUTO_KEY)); }catch(e){ return false; } }

// Phone layout, pinch-zoom, reversible settings, PWA
const MOB={ touch:false, phone:false, land:true, safe:{t:0,r:0,b:0,l:0}, lastTouch:-1e9, lp:null, suppressUntil:0 };
const MOB_PREF_KEYS=['wm_layout','wm_text','wm_mapzoom','wm_tapconfirm','wm_navhint','wm_crew_autoperk'];

function mobPref(){ return prefGet('wm_layout','auto'); }
function mobIsPhoneish(){ let coarse=false; try{ coarse=matchMedia('(pointer:coarse)').matches || (navigator.maxTouchPoints>0 && matchMedia('(hover:none)').matches); }catch(e){}
  const sh=Math.min(window.innerWidth||9999, window.innerHeight||9999); return !!(coarse && sh<=640); }
function mobDetect(){ let coarse=false; try{ coarse=matchMedia('(pointer:coarse)').matches || (navigator.maxTouchPoints>0 && matchMedia('(hover:none)').matches); }catch(e){}
  const w=window.innerWidth, h=window.innerHeight, sh=Math.min(w,h), pref=mobPref();
  MOB.touch=coarse; MOB.phone= pref==='phone' || (pref!=='desktop' && (sh<=600 || w<=640 || (coarse && h>w && w<900))); MOB.land=w>h;
  const de=document.documentElement; de.classList.toggle('touch',MOB.touch); de.classList.toggle('mob',MOB.phone); de.classList.toggle('landscape',MOB.land); de.classList.toggle('portrait',!MOB.land);
  applyTextScale(); }
function textScalePref(){ const p=prefGet('wm_text', null); if(p) return p; return MOB.phone?'large':'normal'; }
function applyTextScale(){ const p=textScalePref(); const map={normal:1, large:1.12, xlarge:1.28}; const t=map[p]||1;
  document.documentElement.style.setProperty('--txt', String(t));
  document.documentElement.classList.toggle('txt-large', p==='large');
  document.documentElement.classList.toggle('txt-xlarge', p==='xlarge');
  if(MOB.phone) document.documentElement.style.fontSize=(15*t).toFixed(1)+'px';
  else document.documentElement.style.fontSize=''; }

function mobResetPhoneDefaults(opt){ opt=opt||{};
  for(const k of MOB_PREF_KEYS) prefDel(k);
  prefSet('wm_layout','auto');
  MAPV.z=1.05;
  mobDetect(); try{ resizeMap(); }catch(e){}
  if(opt.toast!==false) toast('Phone defaults restored. Your saves are untouched.'); }

function mobHandleResetQuery(){ try{ const u=new URL(location.href); if(u.searchParams.get('reset')!=='layout') return;
    mobResetPhoneDefaults({toast:false}); u.searchParams.delete('reset'); const q=u.searchParams.toString(); history.replaceState(null,'',u.pathname+(q?'?'+q:'')+u.hash);
    setTimeout(()=>toast('Layout reset via ?reset=layout. Your saves are untouched.'),800); }catch(e){} }

mobDetect();
mobHandleResetQuery();

window.addEventListener('orientationchange',()=>setTimeout(()=>{ mobDetect(); try{ resizeMap(); if(B) layoutCombat(); }catch(e){} },120));

document.addEventListener('pointerdown',e=>{ if(e.pointerType!=='touch') return; MOB.lastTouch=performance.now(); hideTip();
  if(MOB.lp){ clearTimeout(MOB.lp.tm); MOB.lp=null; }
  const el=e.target.closest&&e.target.closest('[data-tip]'); if(!el||e.target.closest('#map,#ccv')) return;
  const x=e.clientX,y=e.clientY; MOB.lp={x,y,el,tm:setTimeout(()=>{ if(!MOB.lp||MOB.lp.el!==el) return; MOB.lp.fired=true;

function setupTouchMap(){ const cv=MAPV.cv; if(!cv||cv.dataset.touch) return; cv.dataset.touch='1'; const P=new Map(); let g=null;
  const rect=()=>cv.getBoundingClientRect();
  const twoInfo=()=>{ const [a,b]=[...P.values()]; return {d:Math.hypot(a.x-b.x,a.y-b.y)||1, mx:(a.x+b.x)/2, my:(a.y+b.y)/2}; };
  const startPan=(x,y,moved)=>{ g={mode:moved?'pan':'tap',x,y,cx:MAPV.cam.x,cy:MAPV.cam.y}; };
  cv.addEventListener('pointerdown',e=>{ if(e.pointerType!=='touch') return; e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(_){} P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(typeof mobDrawer==='function') mobDrawer(false);
    if(P.size===1){ startPan(e.clientX,e.clientY,false);
      const id=e.pointerId; g.lpT=setTimeout(()=>{ if(!g||g.mode!=='tap'||!P.has(id)) return; g.mode='lp'; const r=rect(); const t=tileFromScreen(e.clientX-r.left,e.clientY-r.top);
        const h=tileTip(t.x,t.y); if(h){ showTip(h,e.clientX,Math.max(8,e.clientY-90)); } },450); }
    else if(P.size===2){ if(g&&g.lpT) clearTimeout(g.lpT); const r=rect(), t=twoInfo(); g={mode:'pinch',d0:t.d,z0:MAPV.z,wx:(t.mx-r.left)/MAPV.z+MAPV.cam.x,wy:(t.my-r.top)/MAPV.z+MAPV.cam.y}; hideTip(); } },{passive:false});
  cv.addEventListener('pointermove',e=>{ if(e.pointerType!=='touch'||!P.has(e.pointerId)) return; e.preventDefault(); P.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(!g) return; MAPV.lastMove=performance.now();
    if(g.mode==='tap'||g.mode==='lp'){ if(Math.hypot(e.clientX-g.x,e.clientY-g.y)>9){ if(g.lpT) clearTimeout(g.lpT); if(g.mode==='lp') hideTip(); g.mode='pan'; } }
    if(g.mode==='pan'){ MAPV.cam.x=g.cx-(e.clientX-g.x)/MAPV.z; MAPV.cam.y=g.cy-(e.clientY-g.y)/MAPV.z; clampCam(); }
    else if(g.mode==='pinch'&&P.size>=2){ const t=twoInfo(), r=rect(); const z=Math.max(0.6,Math.min(2.2,g.z0*t.d/g.d0)); MAPV.z=z; MAPV.cam.x=g.wx-(t.mx-r.left)/z; MAPV.cam.y=g.wy-(t.my-r.top)/z; clampCam(); } },{passive:false});
  const up=e=>{ if(e.pointerType!=='touch'||!P.has(e.pointerId)) return; P.delete(e.pointerId); if(!g) return; if(g.lpT) clearTimeout(g.lpT);
    if(g.mode==='pinch'){ prefSet('wm_mapzoom',String(MAPV.z)); MAPV.justDragged=performance.now(); if(P.size===1){ const [p]=[...P.values()]; startPan(p.x,p.y,true); } else g=null; return; }
    if(g.mode==='pan'||g.mode==='lp'){ MAPV.justDragged=performance.now(); }
    if(P.size===0) g=null; };
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
}

function attrSum(s){ return ATTRS.reduce((a,k)=>a+(s.attrs[k]||0),0); }
function standoutCount(s){ return ATTRS.filter(k=>(s.attrs[k]||0)>=13).length; }
function sailorName(s){ return s.nick?`${s.given} “${s.nick}” ${s.surname}`:`${s.given} ${s.surname}`; }
function startingSkillOf(s){ if(s.startSkill) return s.startSkill; const hit=CREW_SKILLS.filter(k=>(s.skills[k]||0)>0).sort((a,b)=>s.skills[b]-s.skills[a])[0]; return hit?{ id:hit, level:s.skills[hit] }:null; }
function sailorXpNeed(lv){ return 30+lv*18; }
function skillXpNeed(lv){ return 24+lv*16; }

function recruitPrice(sailor, port){ const tot=attrSum(sailor); const stars=standoutCount(sailor);
  let fee=8+Math.max(0,tot-30)*1.6; fee+=stars*20;
  if(tot>=50) fee+=(tot-49)*5; if(tot>=55) fee+=30;
  const start=startingSkillOf(sailor);
  if(start){ fee+=22+start.level*14+(RARE_SKILLS.includes(start.id)?28:0); }
  let mult=1;
  if(port){ const st=typeof repStanding==='function'?repStanding(port.nation):'neutral';
    if(st==='allied') mult*=0.9; else if(st==='friendly') mult*=0.95; else if(st==='unfriendly') mult*=1.12;
    if(port.nation==='pirate') mult*=0.92;
    if(typeof G!=='undefined'&&G&&G.player) mult*=(1-skillBonus(G.player,'trade')*0.025); }
  return Math.max(6,Math.round(fee*mult)); }
function recruitWage(sailor){ const tot=attrSum(sailor); const stars=standoutCount(sailor);
  let w=0.6+Math.max(0,tot-32)*0.05+stars*0.2;
  const start=startingSkillOf(sailor); if(start) w+=0.35+start.level*0.2;
  if(typeof G!=='undefined'&&G) w*=(DIFF[G.difficulty]||DIFF.normal).wage;
  return Math.max(1,Math.round(w)); }

function pickOrigin(rng, prefer){ if(prefer&&ORIGIN_NAMES[prefer]&&rng()<0.55) return prefer;
  const keys=Object.keys(ORIGIN_NAMES); return keys[Math.floor(rng()*keys.length)]; }
function usedNameSet(){ if(!G) return new Set();
  if(!(G._usedNames instanceof Set)){ const prev=G._usedNames; G._usedNames=new Set();
    if(Array.isArray(prev)) for(const k of prev) G._usedNames.add(k);
    if(typeof rebuildUsedNames==='function') rebuildUsedNames(G); }
  return G._usedNames; }
function rollName(rng, origin){ const bag=ORIGIN_NAMES[origin]||ORIGIN_NAMES.england; const used=usedNameSet();
  let given,sur,nick=null, guard=20;
  do{ given=bag.given[Math.floor(rng()*bag.given.length)]; sur=bag.sur[Math.floor(rng()*bag.sur.length)]; }while(used.has(given+'|'+sur)&&--guard>0);
  used.add(given+'|'+sur);
  if(rng()<0.28) nick=NICKS[Math.floor(rng()*NICKS.length)];
  return { given, surname:sur, nick, origin, originAdj:bag.adj }; }

function emptySkills(){ const o={}; for(const k of CREW_SKILLS) o[k]=0; return o; }
function makeSailor(opts){ opts=opts||{};
  const rng=opts.rng||Math.random;
  const origin=opts.origin||pickOrigin(rng, opts.preferOrigin);
  const nm=opts.given?{ given:opts.given, surname:opts.surname||'Sailor', nick:opts.nick||null, origin, originAdj:(ORIGIN_NAMES[origin]||ORIGIN_NAMES.england).adj }:rollName(rng, origin);
  const q=opts.quality||0;
  const roll=()=>clamp(Math.round(4+rng()*6+rng()*6+q),3,18);
  const attrs=opts.attrs||{ str:roll(), agi:roll(), wits:roll(), nerve:roll(), con:roll() };
  const skills=Object.assign(emptySkills(), opts.skills||{});
  const s={ id:opts.id||uid(), ...nm, attrs, skills, skillXp:{}, level:opts.level||1, xp:0, xpNeed:sailorXpNeed(1),
    perks:[], station:opts.station||'guns', protected:!!opts.protected, status:'ok', woundedDays:0,
    morale:opts.morale||(55+Math.round(rng()*25)), loyalty:opts.loyalty||(45+Math.round(rng()*30)),
    shipId:opts.shipId||null, dead:false, startSkill:opts.startSkill||null, portraitSeed:opts.portraitSeed||(Math.floor(rng()*1e9)) };
  if(!s.startSkill){ const sk=startingSkillOf(s); if(sk) s.startSkill=sk; }
  s.wage=opts.wage!=null?opts.wage:recruitWage(s);
  s.hireCost=opts.hireCost!=null?opts.hireCost:recruitPrice(s, opts.port||null);
  s.name=sailorName(s);
  return s; }

function rollRecruit(rng, port, quality){ rng=rng||Math.random; quality=quality||0;
  const prefer=port&&port.nation; const origin=pickOrigin(rng, prefer==='pirate'?null:prefer);
  const s=makeSailor({ rng, origin, preferOrigin:prefer, quality, port });
  const skillChance=0.22+quality*0.08+(port&&port.nation==='pirate'?0.1:0);
  if(rng()<skillChance){ let pool=CREW_SKILLS.slice();
    if(port&&port.nation==='pirate') pool=['cutlass','gunner','rigger','musket','cook','carpenter'];
    if(rng()>0.22) pool=pool.filter(k=>!RARE_SKILLS.includes(k));
    const id=pool[Math.floor(rng()*pool.length)]||'gunner';
    const level=rng()<0.18+quality*0.05?2:1;
    s.skills[id]=level; s.startSkill={ id, level };
    s.wage=recruitWage(s); s.hireCost=recruitPrice(s, port); s.name=sailorName(s); }
  return s; }

function portRecruitQuality(port){ let q=0;
  if(!port) return q; const st=repStanding(port.nation);
  if(st==='allied') q+=1.2; else if(st==='friendly') q+=0.6; else if(st==='unfriendly') q-=0.8;
  if(port.id==='portroyal'||port.id==='willemstad') q+=0.5;
  if(port.id==='nassau'||port.id==='tortuga') q+=0.25;
  if(typeof G!=='undefined'&&G&&G.hideout&&G.hideout.built&&G.hideout.built.tavern&&port.id==='hideout') q+=0.9;
  return q; }

function generateHiringPool(port, n){ if(n==null) n=(port&&port.id==='hideout')?((G.hideout&&G.hideout.built&&G.hideout.built.tavern)?7:3):5; const rng=mulberry32((G.seed||1)^hashStr(port.id+'|'+G.day));
  const q=portRecruitQuality(port); const extra=(repStanding(port.nation)==='allied'?2:0)+(G.hideout&&G.hideout.built&&G.hideout.built.tavern&&port.id==='hideout'?2:0);
  const list=[]; for(let i=0;i<n+extra;i++) list.push(rollRecruit(rng, port, q)); return list; }
function ensureHirePool(port){ if(!port) return []; if(port.hireDay===G.day&&port.hirePool) return port.hirePool;
  port.hireDay=G.day; port.hirePool=generateHiringPool(port, 5); return port.hirePool; }

function livingPlayerCrew(){ if(!G||!G.crew) return []; return G.crew.filter(s=>!s.dead); }
function sailorsOnShip(ship){ if(!G||!G.crew||!ship) return []; const id=typeof ship==='string'?ship:ship.id; return G.crew.filter(s=>!s.dead&&s.shipId===id); }
function ableSailors(ship){ return sailorsOnShip(ship).filter(s=>s.status==='ok'); }
function woundedSailors(ship){ return sailorsOnShip(ship).filter(s=>s.status==='wounded'); }
function shipHasNamedCrew(ship){ return !!(G&&G.crew&&ship&&G.crew.some(s=>s.shipId===ship.id)); }
function crewCount(ship){ if(shipHasNamedCrew(ship)) return ableSailors(ship).length; return ship.crew||0; }
function syncShipCrew(ship){ if(!ship) return; if(shipHasNamedCrew(ship)) ship.crew=ableSailors(ship).length; }
function syncAllNamedCrew(){ if(!G) return; for(const s of G.ships||[]) syncShipCrew(s); }

function hammockRoom(){ const f=playerFleet(); if(!f) return 0;
  return shipsOf(f).reduce((a,s)=>a+Math.max(0,(s.crewMax||0)-sailorsOnShip(s).length),0); }
function assignToRoom(sailor){ const f=playerFleet(); if(!f) return false;
  const ships=shipsOf(f).slice().sort((a,b)=>sailorsOnShip(a).length-sailorsOnShip(b).length);
  for(const sh of ships){ if(sailorsOnShip(sh).length<sh.crewMax){ sailor.shipId=sh.id; return sh; } }
  return false; }

function generateStartingCrew(ship, count, rng, prefer){ rng=rng||Math.random; const list=[];
  for(let i=0;i<count;i++){ const s=rollRecruit(rng, { id:'nassau', nation:prefer||'pirate' }, 0.15);
    s.shipId=ship.id; s.hireCost=0; list.push(s); }
  if(!G.crew) G.crew=[]; G.crew.push(...list); autoAssignCrew(ship); syncShipCrew(ship); return list; }

function stationScore(ship, station){ const def=STATIONS[station]; if(!def) return 0;
  return ableSailors(ship).filter(s=>s.station===station).reduce((a,s)=>{
    const sk=def.skill?(s.skills[def.skill]||0):0; return a+1+sk*0.55+(s.attrs.nerve||8)*0.03; },0); }

function autoAssignCrew(ship){ const pool=sailorsOnShip(ship).filter(s=>s.status!=='dead');
  const free=pool.filter(s=>!s.protected);
  const takeBest=(skill, station, n)=>{ const cand=free.filter(s=>!s._took).sort((a,b)=>(b.skills[skill]||0)-(a.skills[skill]||0));
    for(let i=0;i<n&&i<cand.length;i++){ cand[i].station=station; cand[i]._took=true; } };
  takeBest('surgeon','surgeon',1); takeBest('carpenter','carpenter',1); takeBest('navigator','navigator',1); takeBest('cook','cook',1);
  const left=free.filter(s=>!s._took); const boardN=Math.max(2, Math.round(left.length*0.32));
  takeBest('cutlass','boarding', boardN);
  const rest=free.filter(s=>!s._took);
  rest.sort((a,b)=>((b.skills.gunner||0)-(a.skills.gunner||0))||((a.skills.rigger||0)-(b.skills.rigger||0)));
  rest.forEach((s,i)=>{ s.station=i<Math.ceil(rest.length*0.55)?'guns':'rigging'; s._took=true; });
  pool.filter(s=>s.protected).forEach(s=>{ s.station='reserve'; });
  pool.forEach(s=>{ delete s._took; }); syncShipCrew(ship); }

function autoAssignFleet(){ const f=playerFleet(); if(!f) return; for(const sh of shipsOf(f)) autoAssignCrew(sh);
  toast('Stations filled with the best hands available. Protected sailors stayed in reserve.'); }

function setSailorProtected(sailor, on){ sailor.protected=!!on; if(on) sailor.station='reserve'; }
function setSailorStation(sailor, station){ if(!STATIONS[station]) return false;
  if(sailor.protected && station==='boarding'){ toast(sailorName(sailor)+' is protected — keep them out of the boarding party, or take the protection off first.'); return false; }
  sailor.station=station; if(station==='reserve') sailor.protected=true; return true; }

function trainSailor(s, skill, amount){ if(!s||s.dead||s.status==='wounded') return; if(!CREW_SKILL_INFO[skill]) return;
  const mult=(s.perks||[]).includes('quick_study')?1.35:1;
  amount=Math.max(1,Math.round(amount*mult));
  s.skillXp=s.skillXp||{}; s.skillXp[skill]=(s.skillXp[skill]||0)+amount;
  s.skills[skill]=s.skills[skill]||0;
  while(s.skillXp[skill]>=skillXpNeed(s.skills[skill])){ s.skillXp[skill]-=skillXpNeed(s.skills[skill]); s.skills[skill]++; }
  gainSailorXP(s, Math.max(1,Math.round(amount*0.6))); }
function trainStation(ship, station, skill, amount){ for(const s of ableSailors(ship).filter(x=>x.station===station)) trainSailor(s, skill, amount); }

function gainSailorXP(s, n){ if(!s||s.dead||!n) return; s.xp+=n;
  while(s.xp>=s.xpNeed){ s.xp-=s.xpNeed; s.level++; s.xpNeed=sailorXpNeed(s.level);
    addLog(`${sailorName(s)} reaches rank ${s.level}.`);
    if(!G.pendingSailorLevels) G.pendingSailorLevels=[];
    G.pendingSailorLevels.push(s.id);
    if(crewAutoPerk()){ applySailorPerkAuto(s); G.pendingSailorLevels=G.pendingSailorLevels.filter(id=>id!==s.id); } }
}
function crewAutoPerk(){ return prefGet('wm_crew_autoperk','1')==='1'; }
function sailorPerkChoices(s){ const have=new Set(s.perks||[]);
  const pool=CREW_PERKS.filter(p=>!have.has(p.id));
  const ranked=pool.slice();
  // prefer perks that match their best skill
  const best=CREW_SKILLS.slice().sort((a,b)=>(s.skills[b]||0)-(s.skills[a]||0))[0];
  ranked.sort((a,b)=>{ const am=(a.id==='steady_eye'&&best==='gunner')||(a.id==='deck_fighter'&&best==='cutlass')||(a.id==='gentle_hands'&&best==='surgeon')||(a.id==='rope_wise'&&best==='rigger')?1:0;
    const bm=(b.id==='steady_eye'&&best==='gunner')||(b.id==='deck_fighter'&&best==='cutlass')||(b.id==='gentle_hands'&&best==='surgeon')||(b.id==='rope_wise'&&best==='rigger')?1:0; return bm-am; });
  return ranked.slice(0,2); }
function applySailorPerk(s, pid){ const p=CREW_PERKS.find(x=>x.id===pid); if(!p||!s) return false;
  p.apply(s); if(!s.perks.includes(p.id)) s.perks.push(p.id);
  if(G.pendingSailorLevels) G.pendingSailorLevels=G.pendingSailorLevels.filter(id=>id!==s.id);
  addLog(`${sailorName(s)} chose ${p.name}.`); return true; }
function applySailorPerkAuto(s){ const picks=sailorPerkChoices(s); if(picks[0]) applySailorPerk(s, picks[0].id); }

function bestSurgeonAboard(ship){ const docs=ableSailors(ship).filter(s=>s.station==='surgeon'||(s.skills.surgeon||0)>0).sort((a,b)=>(b.skills.surgeon||0)-(a.skills.surgeon||0)); return docs[0]||null; }
function surgeonSaveChance(ship){ const doc=bestSurgeonAboard(ship); if(!doc) return 0.08;
  let ch=0.22+(doc.skills.surgeon||0)*0.1+(doc.attrs.wits||8)*0.01;
  if(typeof supplyCount==='function'&&supplyCount('medicine')>0) ch+=0.12;
  if(G.hideout&&G.hideout.built&&G.hideout.built.infirmary&&ship.id==='hideout') ch+=0.15;
  return clamp(ch,0.08,0.85); }

function atRiskSailors(ship, kind){ const all=ableSailors(ship);
  if(kind==='boarding') return all.filter(s=>s.station==='boarding');
  if(kind==='grape') return all.filter(s=>s.station!=='reserve'&&s.station!=='surgeon');
  // splinters: everyone but reserve less likely
  return all; }
function pickCasualty(pool, kind){ if(!pool.length) return null;
  const w=pool.map(s=>{ let wt=1; if(s.protected||s.station==='reserve') wt*=0.25; if(kind==='boarding'&&s.station!=='boarding') wt*=0.15;
    wt*=1/Math.max(6,s.attrs.con||8); return wt; });
  let t=w.reduce((a,b)=>a+b,0)*Math.random(), i=0; for(;i<pool.length;i++){ t-=w[i]; if(t<=0) break; }
  return pool[Math.min(i,pool.length-1)]; }

function killSailor(s, how){ if(!s||s.dead) return;
  s.dead=true; s.status='dead'; s.deathDay=G?G.day:0; s.deathHow=how||'lost at sea';
  if(G){ G.crew=G.crew.filter(x=>x.id!==s.id); G.fallen=G.fallen||[]; G.fallen.unshift({ id:s.id, name:sailorName(s), given:s.given, nick:s.nick, surname:s.surname, originAdj:s.originAdj, level:s.level, deathDay:s.deathDay, deathHow:s.deathHow, portraitSeed:s.portraitSeed }); }
  addLog(`<span class="bad">${sailorName(s)} is dead</span> — ${s.deathHow}.`); }
function woundSailor(s, days){ if(!s||s.dead) return;
  s.status='wounded'; s.woundedDays=Math.max(s.woundedDays||0, days!=null?days:clamp(3-Math.floor((s.attrs.con||8)/6)+irnd(0,2),2,6));
  addLog(`${sailorName(s)} is wounded (${s.woundedDays} days).`); }

function inflictCrewHits(ship, opts){ opts=opts||{};
  if(!shipHasNamedCrew(ship)){ if(opts.hits&&ship.crew) ship.crew=Math.max(0,ship.crew-(opts.numeric!=null?opts.numeric:Math.max(1,Math.round((opts.hits||1)*0.6)))); return { killed:[], wounded:[], saved:[] }; }
  const hits=opts.hits||1, kind=opts.kind||'grape'; const killBias=opts.killBias!=null?opts.killBias:(kind==='boarding'?0.35:kind==='grape'?0.28:0.18);
  const killed=[], wounded=[], saved=[]; let pool=atRiskSailors(ship, kind);
  if(!pool.length) pool=ableSailors(ship);
  for(let i=0;i<hits&&pool.length;i++){ const s=pickCasualty(pool, kind); if(!s) break;
    pool=pool.filter(x=>x.id!==s.id);
    let die=Math.random()<killBias*(1-(s.attrs.con||8)*0.03);
    if(die){ const ch=surgeonSaveChance(ship);
      if(Math.random()<ch){ die=false; saved.push(s); if(typeof consumeSupply==='function') consumeSupply('medicine',1); trainSailor(bestSurgeonAboard(ship),'surgeon',10); } }
    if(die){ killSailor(s, kind==='boarding'?'cut down in the boarding':kind==='grape'?'swept by grape shot':kind==='starve'?'the stores ran out':kind==='raid'?'killed in a raid on the hideout':'splinters from the hull'); killed.push(s); }
    else { woundSailor(s); wounded.push(s); if(bestSurgeonAboard(ship)) trainSailor(bestSurgeonAboard(ship),'surgeon',5); } }
  syncShipCrew(ship);
  if(typeof B!=='undefined'&&B&&!B.over){ B.casualties=B.casualties||{killed:[],wounded:[],saved:[]};
    for(const s of killed) B.casualties.killed.push(sailorName(s));
    for(const s of wounded) B.casualties.wounded.push(sailorName(s));
    for(const s of saved) B.casualties.saved.push(sailorName(s)); }
  return { killed, wounded, saved }; }

function recoverCrewDaily(){ if(!G||!G.crew) return;
  recoverCrewDaily._med=false;
  const hideoutHeal=G.hideout&&G.hideout.built&&G.hideout.built.infirmary?2:0;
  for(const s of G.crew){ if(s.dead||s.status!=='wounded') continue;
    let rec=1; const ship=s.shipId==='hideout'?{ id:'hideout' }: (G.ships||[]).find(x=>x.id===s.shipId);
    const doc=ship?bestSurgeonAboard(ship):null; if(doc) rec+=1+Math.min(2,Math.floor((doc.skills.surgeon||0)/3));
    if(s.shipId==='hideout') rec+=hideoutHeal;
    if(typeof supplyCount==='function'&&supplyCount('medicine')>0&&doc&&!recoverCrewDaily._med){ rec+=1; consumeSupply('medicine',1); recoverCrewDaily._med=true; }
    s.woundedDays=Math.max(0,(s.woundedDays||1)-rec);
    if(s.woundedDays<=0){ s.status='ok'; s.woundedDays=0; addLog(`${sailorName(s)} is back on their feet.`); } }
  syncAllNamedCrew(); }

function hireRecruit(port, sailor){ if(!sailor) return false;
  if(hammockRoom()<=0){ toast('No hammocks left. You need a bigger ship, or someone must go ashore.'); return false; }
  const fee=recruitPrice(sailor, port);
  if(G.player.gold<fee){ toast('Not enough gold for their signing fee.'); return false; }
  G.player.gold-=fee; sailor.hireCost=fee; sailor.wage=recruitWage(sailor);
  if(!assignToRoom(sailor)){ toast('No room.'); return false; }
  if(port&&port.hirePool) port.hirePool=port.hirePool.filter(x=>x.id!==sailor.id);
  G.crew.push(sailor); const sh=(G.ships||[]).find(x=>x.id===sailor.shipId); if(sh){ if(!sailor.station||sailor.station==='guns'){ /* keep rolled default */ } syncShipCrew(sh); }
  addLog(`Signed ${sailorName(sailor)} in ${port?port.name:'port'} for ${fee} gold (${sailor.wage} gold/day).`);
  toast(`Welcome aboard, ${sailorName(sailor)}.`); renderAll(); if(typeof renderPort==='function') renderPort(); return true; }

// keep old recruitCrew as “hire next N from the pool” so older calls still do something sensible
recruitCrew = function(port, qty){ qty=Math.max(1,qty|0); ensureHirePool(port); let n=0;
  while(n<qty&&port.hirePool&&port.hirePool.length){ if(!hireRecruit(port, port.hirePool[0])) break; n++; }
  return n; }

crewWage = function(captain, crewTotal){ if(G&&G.crew&&G.crew.length){ let w=livingPlayerCrew().reduce((a,s)=>a+(s.wage||1),0);
    if((captain.perks||[]).includes('iron_discipline')) w=Math.round(w*1.25);
    w*=Math.max(0.75,1-(captain.skills.leadership||0)*0.03); return Math.max(1,Math.round(w)); }
  const lead=(captain&&captain.skills.leadership)||0; let w=(crewTotal||0)*0.35*(DIFF[G&&G.difficulty]||DIFF.normal).wage; if((captain.perks||[]).includes('iron_discipline')) w*=1.25; w*=Math.max(0.7,1-lead*0.04); return Math.max(1,Math.round(w)); }

fleetCrew = function(fleet){ if(!fleet) return 0; const ships=shipsOf(fleet);
  if(fleet.owner==='player'&&G.crew) return G.crew.filter(s=>!s.dead&&(s.shipId==='hideout'||ships.some(sh=>sh.id===s.shipId))).length;
  return ships.reduce((a,s)=>a+(s.crew||0),0); }

function dailyCrewTick(f, wage){ if(!G||!G.crew) return;
  if(G.player.gold>=0&&G.player.unpaid===0){ for(const s of livingPlayerCrew()) s.loyalty=clamp((s.loyalty||50)+1,0,100); }
  if(G.player.unpaid>0){ const pool=livingPlayerCrew().filter(s=>s.shipId!=='hideout').sort((a,b)=>(a.loyalty||50)-(b.loyalty||50));
    const n=Math.min(pool.length, 1+Math.floor(Math.random()*3));
    for(let i=0;i<n;i++){ const s=pool[i]; if(!s) break; addLog(`${sailorName(s)} slipped away in the night (unpaid).`); G.crew=G.crew.filter(x=>x.id!==s.id); } }
  const cookBonus=shipsOf(f).reduce((a,sh)=>a+stationScore(sh,'cook'),0);
  G.player.morale=clamp(G.player.morale+Math.min(3,Math.floor(cookBonus/4)),0,100);
  recoverCrewDaily(); syncAllNamedCrew(); }

function migrateCrewIfNeeded(g){ if(!g) return g;
  if(!g.fallen) g.fallen=[]; if(!g.pendingSailorLevels) g.pendingSailorLevels=[];
  if(!g.crew) g.crew=[];
  const playerShipIds=new Set();
  for(const f of (g.fleets||[])){ if(f.owner==='player') for(const id of (f.ships||[])) playerShipIds.add(id); }
  const already=g.crew.length>0;
  if(!already){ const rng=mulberry32((g.seed||1)^0xC2E4);
    for(const ship of (g.ships||[])){ if(!playerShipIds.has(ship.id)) continue;
      const n=Math.max(0, ship.crew|0); generateMigrated(g, ship, n, rng); } }
  for(const s of g.crew){ if(!s.name) s.name=sailorName(s); if(!s.skills) s.skills=emptySkills(); if(s.wage==null) s.wage=recruitWage(s); }
  g.version=g.version||'0.2.0';
  if(g.version==='0.1.0') g.version='0.2.0';
  return g; }
function generateMigrated(g, ship, n, rng){ const save=G; G=g; if(!G._usedNames) G._usedNames=new Set();
  for(let i=0;i<n;i++){ const s=rollRecruit(rng, { id:'nassau', nation:'pirate' }, 0); s.shipId=ship.id; g.crew.push(s); }
  autoAssignCrew(ship); syncShipCrew(ship); G=save; }

function boardingStrength(ship, side){ if(side==='player'&&shipHasNamedCrew(ship)){
    const all=ableSailors(ship).filter(s=>s.station!=='reserve');
    const boarders=all.filter(s=>s.station==='boarding');
    const support=all.filter(s=>s.station!=='boarding');
    let sc=boarders.reduce((a,s)=>a+1+(s.skills.cutlass||0)*0.5+(s.attrs.str||8)*0.05+(s.attrs.nerve||8)*0.04,0);
    sc+=support.length*0.35;
    if(typeof weaponBonusFor==='function') sc+=weaponBonusFor(boarders,'board');
    if(typeof grogPenalty==='function') sc*=(1+(grogPenalty()||0));
    return Math.max(1,sc); }
  return (ship.crew||0); }

function gunnerySkillBonus(ship, side){ if(side==='player'&&shipHasNamedCrew(ship)){
    const gunners=ableSailors(ship).filter(s=>s.station==='guns');
    const sk=gunners.reduce((a,s)=>a+(s.skills.gunner||0),0);
    return 0.12*Math.min(8, gunners.length*0.15+sk*0.08); }
  return 0; }

function leaveSailorAshore(sailor){ sailor.shipId='hideout'; sailor.station=sailor.protected?'reserve':(sailor.status==='wounded'?'reserve':sailor.station);
  addLog(`${sailorName(sailor)} goes ashore at the hideout.`); syncAllNamedCrew(); }
function recallSailor(sailor, ship){ if(!ship){ const f=playerFleet(); ship=f&&flagshipOf(f); }
  if(!ship) return false; if(sailorsOnShip(ship).length>=ship.crewMax){ toast('No hammocks on that ship.'); return false; }
  sailor.shipId=ship.id; syncShipCrew(ship); return true; }

function prizeCrewOffers(ship, nation, n){ n=n||irnd(2,4); const rng=Math.random; const list=[];
  for(let i=0;i<n;i++){ const s=rollRecruit(rng, { id:'prize', nation:nation||'spain' }, 0.1); s.shipId=null; list.push(s); }
  return list; }


function staffPrizeShip(ship, n, nation){ if(!ship||!G) return [];
  n=Math.max(0,n==null?ship.crew||0:n); const list=[];
  for(let i=0;i<n;i++){ const s=rollRecruit(Math.random, { id:'prize', nation:nation||'pirate' }, 0.05);
    s.shipId=ship.id; s.hireCost=0; G.crew.push(s); list.push(s); }
  autoAssignCrew(ship); syncShipCrew(ship); return list; }

function rebuildUsedNames(g){ g=g||G; if(!g) return; g._usedNames=new Set();
  for(const s of (g.crew||[])) g._usedNames.add((s.given||'')+'|'+(s.surname||''));
  for(const s of (g.fallen||[])) if(s.given) g._usedNames.add(s.given+'|'+(s.surname||'')); }

function findSailor(id){ return (G&&G.crew||[]).find(s=>s.id===id)||null; }

// Provisions, weapons, cannons, paid skill training — gold sinks with trade-offs
const SUPPLY_KINDS=['food','water','ale','medicine'];
const SUPPLY_INFO={
  food:{ name:'Food', unit:'crate', perCrate:40, cargo:1, cost:8, desc:'One crate holds forty rations — one ration feeds one mouth for a day.' },
  water:{ name:'Water', unit:'cask', perCrate:40, cargo:1, cost:5, desc:'One cask holds forty rations of water.' },
  ale:{ name:'Ale & rum', unit:'keg', perCrate:40, cargo:1, cost:10, desc:'Keeps spirits up. Too little breeds mutiny; too much makes sloppy hands.' },
  medicine:{ name:'Medicine', unit:'chest', perCrate:1, cargo:1, cost:18, desc:'Helps the surgeon save the wounded.' }
};
const ALE_RATIONS={
  none:{ id:'none', name:'Dry', per:0, morale:-8, note:'No grog. The crew grumbles.' },
  light:{ id:'light', name:'Light', per:0.4, morale:-2, note:'A small tot. They notice.' },
  normal:{ id:'normal', name:'Normal', per:1, morale:2, note:'The usual tot. Fair and expected.' },

};
const WEAPON_INFO={

const PORT_TRAIN={
  gunner:{ name:'Gunnery drill', skill:'gunner', days:2, gold:28 },

function ensureSupplies(g){ g=g||G; if(!g.supplies) g.supplies={ food:120, water:120, ale:48, medicine:2 }; for(const k of SUPPLY_KINDS) if(g.supplies[k]==null) g.supplies[k]=0;
  if(!g.armory) g.armory={ cutlass:0, pistol:0, musket:0, axe:0 };
  if(!g.aleRation) g.aleRation='normal';
  if(g.voyageDays==null) g.voyageDays=0;
  return g; }
function supplyCount(k){ return (G&&G.supplies&&G.supplies[k])||0; }
function consumeSupply(k, n){ if(!G||!G.supplies) return 0; n=n||1; const take=Math.min(n, G.supplies[k]||0); G.supplies[k]-=take; return take; }

function mouthsToFeed(){ if(!G) return 1; const atSea=livingPlayerCrew().filter(s=>s.shipId!=='hideout').length; return Math.max(1, atSea + 1); /* captain */ }
function supplyCargoUsed(){ if(!G||!G.supplies) return 0;
  let u=0; for(const k of SUPPLY_KINDS){ const info=SUPPLY_INFO[k]; u+=Math.ceil((G.supplies[k]||0)/info.perCrate)*info.cargo; }
  return u; }
function fleetCargoUsed(){ const f=playerFleet(); if(!f) return supplyCargoUsed();
  return shipsOf(f).reduce((a,s)=>a+Object.values(s.cargo||{}).reduce((x,y)=>x+y,0),0)+supplyCargoUsed(); }
function fleetCargoMax(){ const f=playerFleet(); if(!f) return 20; return shipsOf(f).reduce((a,s)=>a+(s.cargoMax||0),0); }
function cargoFree(){ return Math.max(0, fleetCargoMax()-fleetCargoUsed()); }

function daysOfFood(){ const m=mouthsToFeed(); const food=Math.floor(supplyCount('food')/m); const water=Math.floor(supplyCount('water')/m); return Math.min(food,water); }
function daysOfAle(){ const r=ALE_RATIONS[G.aleRation||'normal']; const need=r.per*mouthsToFeed(); if(need<=0) return 99; return Math.floor(supplyCount('ale')/need); }
function storesHud(){ const d=daysOfFood(); if(d<=0) return 'Stores 0d'; if(d<=3) return `Stores ${d}d!`; return `Stores ${d}d`; }

function buySupply(kind, crates, port){ const info=SUPPLY_INFO[kind]; if(!info) return false;
  crates=Math.max(1,crates|0);
  const price=Math.round(info.cost*crates*(port&&typeof buyPrice==='function'?1:1));
  const space=crates*info.cargo;
  if(cargoFree()<space){ toast('The hold is full — sell goods, or leave stores ashore.'); return false; }
  if(G.player.gold<price){ toast('Not enough gold.'); return false; }
  G.player.gold-=price; G.supplies[kind]=(G.supplies[kind]||0)+crates*info.perCrate;
  addLog(`Bought ${crates} ${info.unit}${crates>1?'s':''} of ${info.name.toLowerCase()} for ${price} gold.`);
  renderAll(); if(typeof renderPort==='function') renderPort(); return true; }
function sellSupply(kind, crates){ const info=SUPPLY_INFO[kind]; if(!info) return false;
  crates=Math.max(1,crates|0); const have=Math.floor(supplyCount(kind)/info.perCrate);
  if(have<crates){ toast('You do not have that many.'); return false; }
  const gold=Math.round(info.cost*0.45*crates);
  G.supplies[kind]-=crates*info.perCrate; G.player.gold+=gold;
  addLog(`Sold ${crates} ${info.unit}${crates>1?'s':''} of ${info.name.toLowerCase()} for ${gold} gold.`);
  renderAll(); if(typeof renderPort==='function') renderPort(); return true; }

function topUpSupplies(days, port){ days=Math.max(1,days|0); const m=mouthsToFeed();
  const r=ALE_RATIONS[G.aleRation||'normal'];
  const need={ food:Math.max(0, days*m - supplyCount('food')),
    water:Math.max(0, days*m - supplyCount('water')),
    ale:Math.max(0, Math.ceil(days*m*r.per) - supplyCount('ale')) };
  let crates={}; let space=0, gold=0;
  for(const k of ['food','water','ale']){ const info=SUPPLY_INFO[k]; crates[k]=Math.ceil(need[k]/info.perCrate); space+=crates[k]*info.cargo; gold+=crates[k]*info.cost; }
  if(gold<=0){ toast('Stores already cover that many days.'); return false; }
  if(cargoFree()<space){ toast('Not enough hold space to top up that far.'); return false; }
  if(G.player.gold<gold){ toast(`Need ${gold} gold to top up ${days} days.`); return false; }
  for(const k of ['food','water','ale']){ if(crates[k]>0){ G.player.gold-=crates[k]*SUPPLY_INFO[k].cost; G.supplies[k]+=crates[k]*SUPPLY_INFO[k].perCrate; } }
  addLog(`Topped up stores for ${days} days (${gold} gold).`); toast(`Stores ready for ${days} days at sea.`);
  renderAll(); if(typeof renderPort==='function') renderPort(); return true; }

function setAleRation(id){ if(!ALE_RATIONS[id]) return; G.aleRation=id; toast('Ration set to '+ALE_RATIONS[id].name+'.'); renderAll(); if(typeof renderPort==='function') renderPort(); }

function consumeDailySupplies(){ if(!G||!G.supplies) return;
  const m=mouthsToFeed(); const r=ALE_RATIONS[G.aleRation||'normal'];
  const ate=consumeSupply('food', m); const drank=consumeSupply('water', m);
  const grogNeed=Math.ceil(m*r.per); const grog=grogNeed?consumeSupply('ale', grogNeed):0;
  let dMorale=r.morale;
  if(ate<m){ dMorale-=10; G.player.morale=clamp(G.player.morale-6,0,100); addLog('<span class="bad">The food has run out.</span> The crew goes hungry.'); starveTick(m-ate); }
  if(drank<m){ dMorale-=12; addLog('<span class="bad">The water casks are empty.</span>'); starveTick(Math.ceil((m-drank)/2)); }
  if(grogNeed && grog<grogNeed){ dMorale-=6; if((G.aleRation||'normal')!=='none') addLog('The grog ran short.'); }
  if(r.effect){ /* heavy grog slack: applied in combat via grogPenalty() */ }
  G.player.morale=clamp(G.player.morale+dMorale,0,100);
  if(G.player.morale<25 && Math.random()<0.12){ const pool=livingPlayerCrew().filter(s=>s.shipId!=='hideout'&&!s.protected).sort((a,b)=>(a.loyalty||50)-(b.loyalty||50));
    if(pool[0]){ addLog(`${sailorName(pool[0])} deserted in the night (low morale).`); G.crew=G.crew.filter(x=>x.id!==pool[0].id); } }
  G.voyageDays=(G.voyageDays||0)+1; }

function starveTick(n){ const f=playerFleet(); const sh=f&&flagshipOf(f); if(!sh||!shipHasNamedCrew(sh)) return;
  if(Math.random()<0.35) inflictCrewHits(sh, { hits:Math.min(2,n), kind:'starve', killBias:0.2 }); }

function grogPenalty(){ const r=ALE_RATIONS[(G&&G.aleRation)||'normal']; return r.effect||0; }

function buyWeapon(kind, qty){ const info=WEAPON_INFO[kind]; if(!info) return false;
  qty=Math.max(1,qty|0); const gold=info.cost*qty; if(G.player.gold<gold){ toast('Not enough gold.'); return false; }
  G.player.gold-=gold; G.armory[kind]=(G.armory[kind]||0)+qty;
  addLog(`Bought ${qty} ${info.name.toLowerCase()}${qty>1?'s':''} for ${gold} gold.`); renderAll(); if(typeof renderPort==='function') renderPort(); return true; }

function issuedWeapons(){ const n=livingPlayerCrew().filter(s=>s.station==='boarding'&&s.status==='ok').length;
  const arm=G.armory||{}; let board=0, musk=0;
  const cut=Math.min(n, arm.cutlass||0); board+=cut*WEAPON_INFO.cutlass.board;
  const axes=Math.min(Math.max(0,n-cut), arm.axe||0); board+=axes*WEAPON_INFO.axe.board;
  const pist=Math.min(n, arm.pistol||0); board+=pist*WEAPON_INFO.pistol.board; musk+=pist*WEAPON_INFO.pistol.musket;
  const muskets=Math.min(n, arm.musket||0); musk+=muskets*WEAPON_INFO.musket.musket;
  return { board, musk, armed:Math.min(n, (arm.cutlass||0)+(arm.axe||0)), n }; }
function weaponBonusFor(boarders, kind){ const iss=issuedWeapons(); return kind==='board'?iss.board:iss.musk; }

function setShipGunType(ship, type){ const gt=GUN_TYPES[type]; if(!gt||!ship) return false;
  if((ship.gunType||'demi')===type) return true;
  const cost=gt.cost*Math.max(1, ship.cannons||1);
  if(type!=='demi' && G.player.gold<cost){ toast('Need '+cost+' gold to recast the battery.'); return false; }
  if(type!=='demi') G.player.gold-=cost;
  ship.gunType=type; if(typeof refreshShipDerived==='function') refreshShipDerived(ship,G.player);
  addLog(ship.name+"'s battery is now "+gt.name.toLowerCase()+'s.'); renderAll(); if(typeof renderPort==='function') renderPort(); return true; }
function gunMult(ship){ return GUN_TYPES[(ship&&ship.gunType)||'demi']||GUN_TYPES.demi; }

function buyExtraGun(ship){ if(!ship) return false;
  if((ship.extraGuns||0)>=6){ toast('No more spare gun ports.'); return false; }
  const cost=45; if(G.player.gold<cost){ toast('Not enough gold.'); return false; }
  G.player.gold-=cost; ship.extraGuns=(ship.extraGuns||0)+1;
  if(typeof refreshShipDerived==='function') refreshShipDerived(ship,G.player);
  addLog('Mounted another gun on '+ship.name+' ('+cost+' gold).'); renderAll(); if(typeof renderPort==='function') renderPort(); return true; }

function portTrainOffer(port){ const spec=(port&&PORT_SPECIAL[port.id])||[];
  return Object.values(PORT_TRAIN).map(t=>{ const specialized=spec.includes(t.skill);
    let disc=1; if(specialized) disc*=0.7;
    if(G.hideout&&G.hideout.built&&G.hideout.built.training&&port&&port.id==='hideout') disc*=0.75;
    return { ...t, specialized, gold:Math.round(t.gold*disc), days:t.days }; }); }
function startCrewTraining(sailor, offer){ if(!sailor||!offer) return false;
  if(sailor.status!=='ok'){ toast('They are not fit to train.'); return false; }
  if(G.player.gold<offer.gold){ toast('Not enough gold.'); return false; }
  G.player.gold-=offer.gold;
  const amt=18+offer.days*10+(offer.specialized?8:0);
  trainSailor(sailor, offer.skill, amt);
  G.trainBusy=(G.trainBusy||0)+offer.days;
  addLog(`${sailorName(sailor)} trains ${CREW_SKILL_INFO[offer.skill].name.toLowerCase()} for ${offer.gold} gold (${offer.days} days).`);
  toast(`${sailorName(sailor)} drilled in ${CREW_SKILL_INFO[offer.skill].name.toLowerCase()}.`);
  renderAll(); if(typeof renderPort==='function') renderPort(); return true; }

function buyHull(defId, port){ const def=SHIP_CLASSES[defId]; if(!def) return false;
  const f=playerFleet(); if(!f) return false;
  if(shipsOf(f).length>=MAX_FLEET){ toast('Your fleet is full (three ships).'); return false; }
  const price=Math.round(def.cost*(port&&port.nation==='pirate'?0.92:1));
  if(G.player.gold<price){ toast('Not enough gold for that hull.'); return false; }
  G.player.gold-=price; const ship=makeShip(defId, 'pirate');
  G.ships.push(ship); f.ships.push(ship.id);
  addLog('Bought the '+def.name.toLowerCase()+' '+ship.name+' for '+price+' gold.'); toast(ship.name+' joins the fleet.');
  renderAll(); if(typeof renderPort==='function') renderPort(); if(typeof renderHideout==='function') renderHideout(); return true; }

// Player hideout — Saltkey Cove. HoMM-style upgrades with real either-or choices.
const HIDEOUT_TILE={ x:12, y:14 };
const HIDEOUT_BUILDINGS={
  dock:{ id:'dock', name:'Dock', cost:180, days:3, wood:8, desc:'A hidden slip where you careen and patch hulls for half the usual yard fee.', requires:null },
  warehouse:{ id:'warehouse', name:'Warehouse', cost:140, days:3, wood:6, desc:'A dry cave for loot and cargo. Goods stored here are safe from a sinking and can be sold later.', requires:null },
  tavern:{ id:'tavern', name:'Tavern', cost:160, days:3, wood:5, desc:'Rum, rumours, and a better hiring pool when you recruit at the cove. Morale recovers faster ashore.', requires:null },
  infirmary:{ id:'infirmary', name:'Infirmary', cost:150, days:3, wood:4, desc:'Wounded left at the cove heal much faster. A surgeon ashore does even better.', requires:null },
  training:{ id:'training', name:'Training yard', cost:170, days:3, wood:5, desc:'Cheaper paid drills than any colonial port. Favourites can train while they sit out a cruise.', requires:null },
  // either-or: dock specialization
  careening:{ id:'careening', name:'Careening yard', cost:220, days:4, wood:10, desc:'Hull repairs here cost even less, and a careened ship sails a little cleaner for a week.', requires:'dock', either:'dock_spec' },
  slipway:{ id:'slipway', name:'Slipway', cost:260, days:5, wood:14, desc:'You can build a sloop or schooner here, slowly, instead of buying one in port.', requires:'dock', either:'dock_spec' },
  // either-or: arms
  armory:{ id:'armory', name:'Armory', cost:190, days:4, wood:6, desc:'Cutlasses, pistols and muskets cost less here, and issued weapons are kept sharp (+boarding).', requires:null, either:'arms' },
  foundry:{ id:'foundry', name:'Foundry', cost:240, days:5, wood:8, desc:'Cast extra guns and recast batteries for less. Culverins and carronades are cheaper here.', requires:null, either:'arms' },
  // defenses (stackable-ish; first tier then either-or eyes)
  palisade:{ id:'palisade', name:'Palisade & lookouts', cost:130, days:3, wood:8, desc:'A first ring of defense. Raiders think twice. Lookouts give a little warning.', requires:null },
  batteries:{ id:'batteries', name:'Shore batteries', cost:280, days:5, wood:10, desc:'Cannon covering the approach. A raid against a well-gunned cove is a bloody affair for the attacker.', requires:'palisade' },
  // either-or: eyes
  lookout:{ id:'lookout', name:'Lookout tower', cost:150, days:3, wood:6, desc:'Reveals nearby sea for several tiles around the cove — patrols and merchants no longer sneak up.', requires:null, either:'eyes' },
  channel:{ id:'channel', name:'Hidden channel', cost:170, days:4, wood:5, desc:'A masked approach. Fleets that do not already know the cove have a harder time finding it to raid.', requires:null, either:'eyes' },
  // income
  market:{ id:'market', name:'Cove market', cost:200, days:4, wood:4, desc:'A trickle of honest (ish) trade. A few gold each day from fishers and smugglers who use the cove.', requires:'warehouse' },
  smugglers:{ id:'smugglers', name:'Smugglers\' den', cost:220, days:4, wood:3, desc:'A shadier trickle, a little larger, but it slightly sours your name with the crowns.', requires:'tavern', either:'income_style' },
  fishery:{ id:'fishery', name:'Fishery', cost:160, days:3, wood:4, desc:'A modest, clean income and a little free food each week. Less gold than the smugglers\' den.', requires:'dock', either:'income_style' }
};
const HIDEOUT_EITHER={
  dock_spec:['careening','slipway'],
  arms:['armory','foundry'],
  eyes:['lookout','channel'],
  income_style:['smugglers','fishery']
};

function hideoutDefault(){ return {
  claimed:false, name:'Saltkey Cove', x:HIDEOUT_TILE.x, y:HIDEOUT_TILE.y,
  built:{}, building:null, warehouse:{}, defense:0, lastRaidDay:-99, raidThreat:0, wood:12, revealed:{}
}; }
function ensureHideout(g){ g=g||G; if(!g.hideout) g.hideout=hideoutDefault();
  const h=g.hideout;
  if(h.x==null&&h.q!=null){ h.x=h.q; h.y=h.r; }
  if(h.x==null){ h.x=HIDEOUT_TILE.x; h.y=HIDEOUT_TILE.y; }
  if(!h.built) h.built={}; if(!h.warehouse) h.warehouse={};
  if(h.wood==null) h.wood=8; if(!h.name) h.name='Saltkey Cove';
  return h; }

function hideoutBuilt(id){ return !!(G&&G.hideout&&G.hideout.built&&G.hideout.built[id]); }
function hideoutEitherTaken(group){ const ids=HIDEOUT_EITHER[group]||[]; return ids.find(id=>hideoutBuilt(id))||null; }
function hideoutCanBuild(id){ const def=HIDEOUT_BUILDINGS[id]; if(!def||!G||!G.hideout||!G.hideout.claimed) return { ok:false, why:'Claim the cove first.' };
  if(hideoutBuilt(id)) return { ok:false, why:'Already standing.' };
  if(G.hideout.building) return { ok:false, why:'A crew is already raising something.' };
  if(def.requires && !hideoutBuilt(def.requires)) return { ok:false, why:'Needs '+HIDEOUT_BUILDINGS[def.requires].name+' first.' };
  if(def.either){ const taken=hideoutEitherTaken(def.either); if(taken) return { ok:false, why:'You already chose '+HIDEOUT_BUILDINGS[taken].name+'. That path is closed.' }; }
  if((G.player.gold||0)<def.cost) return { ok:false, why:'Need '+def.cost+' gold.' };
  if((G.hideout.wood||0)<(def.wood||0)) return { ok:false, why:'Need '+(def.wood||0)+' timber.' };
  return { ok:true }; }

function startHideoutBuild(id){ const def=HIDEOUT_BUILDINGS[id]; const can=hideoutCanBuild(id);
  if(!can.ok){ toast(can.why); return false; }
  G.player.gold-=def.cost; G.hideout.wood-=(def.wood||0);
  G.hideout.building={ id, name:def.name, left:def.days, total:def.days };
  addLog(`Work begins on the ${def.name.toLowerCase()} at Saltkey Cove (${def.days} days, ${def.cost} gold).`);
  toast(`Raising the ${def.name}. ${def.days} days.`);
  renderAll(); if(typeof renderHideout==='function') renderHideout(); return true; }

function hideoutDayTick(){ if(!G||!G.hideout||!G.hideout.claimed) return;
  const h=G.hideout;
  if(h.building){ h.building.left--; if(h.building.left<=0){ const id=h.building.id; h.built[id]=true; const def=HIDEOUT_BUILDINGS[id];
      addLog(`<span class="good">The ${def.name.toLowerCase()} at Saltkey Cove is finished.</span>`); toast(def.name+' is ready.'); h.building=null;
      if(id==='lookout') revealAroundHideout(5); if(id==='channel') revealAroundHideout(2); } }
  if(h.built.lookout) revealAroundHideout(5);
  if(h.shipBuilding){ h.shipBuilding.left--; if(h.shipBuilding.left<=0){ const def=SHIP_CLASSES[h.shipBuilding.cls];
      if(def){ const ship=makeShip(h.shipBuilding.cls,'pirate'); const f=playerFleet();
        if(f&&shipsOf(f).length<MAX_FLEET){ G.ships.push(ship); f.ships.push(ship.id); addLog('<span class="good">The '+def.name.toLowerCase()+' '+ship.name+' slides off the slipway.</span>'); toast(ship.name+' is launched.'); }
        else { const gold=Math.round(def.cost*0.4); G.player.gold+=gold; addLog('No room in the fleet — the new hull was sold for '+gold+' gold.'); } }
      h.shipBuilding=null; } }
  // income trickle
  let gold=0;
  if(h.built.market) gold+=irnd(2,5);
  if(h.built.smugglers){ gold+=irnd(4,8); if(Math.random()<0.08){ for(const n of ['england','spain','france','netherlands']) G.player.reputation[n]=clamp((G.player.reputation[n]||0)-1,-100,100); } }
  if(h.built.fishery){ gold+=irnd(2,4); if(Math.random()<0.4) G.supplies.food=(G.supplies.food||0)+2; }
  if(gold){ G.player.gold+=gold; h.lastIncome=gold; }
  // tavern morale for crew ashore
  if(h.built.tavern){ for(const s of (G.crew||[]).filter(x=>x.shipId==='hideout'&&!x.dead)){ s.morale=clamp((s.morale||50)+3,0,100); s.loyalty=clamp((s.loyalty||50)+1,0,100); }
    G.player.morale=clamp(G.player.morale+1,0,100); }
  // raid threat grows slowly if weakly defended and the player is infamous
  const heat=Object.values(G.player.reputation||{}).filter(v=>v< -20).length;
  if(heat && !(h.built.channel && Math.random()<0.45)){ h.raidThreat=(h.raidThreat||0)+heat*0.15; }
  else h.raidThreat=Math.max(0,(h.raidThreat||0)-0.2);
  if((h.raidThreat||0)>12 && G.day-(h.lastRaidDay||-99)>18 && Math.random()<0.18) maybeRaidHideout();
}

function hideoutDefenseScore(){ const h=G.hideout; if(!h) return 0;
  let d=0; if(h.built.palisade) d+=3; if(h.built.batteries) d+=6; if(h.built.lookout) d+=1; if(h.built.channel) d+=2;
  d+=Math.min(6, (G.crew||[]).filter(s=>s.shipId==='hideout'&&s.status==='ok'&&!s.dead).length*0.35);
  return d; }

function maybeRaidHideout(){ const h=G.hideout; h.lastRaidDay=G.day; h.raidThreat=0;
  const def=hideoutDefenseScore(); const atk=6+irnd(0,6);
  const ashore=(G.crew||[]).filter(s=>s.shipId==='hideout'&&!s.dead&&s.status==='ok');
  if(def>=atk){ addLog('A patrol nosed toward Saltkey Cove and was driven off by the defenses.');
    toast('The cove held. Raiders driven off.'); return { won:true, atk, def }; }
  // loss: steal some warehouse goods, maybe wound/kill an unprotected sailor
  const stolen=[]; if(h.warehouse){ for(const [k,v] of Object.entries(h.warehouse)){ if(v>0){ const take=Math.min(v, 1+Math.floor(v*0.3)); h.warehouse[k]-=take; stolen.push(take+' '+k); } } }
  const lootGold=Math.min(G.player.gold, 20+irnd(10,40)); G.player.gold-=lootGold;
  let hurt=null;
  if(ashore.length && Math.random()<0.45){ const pool=ashore.filter(s=>!s.protected); const victim=pool[0]||ashore[0];
    hurt=inflictCrewHits({ id:'hideout' }, { hits:1, kind:'raid', killBias:0.25 }); }
  addLog(`<span class="bad">Raiders struck Saltkey Cove</span> (defense ${def} vs ${atk}). They made off with ${lootGold} gold${stolen.length?' and '+stolen.join(', '):''}.`);
  toast('The hideout was raided!'); return { won:false, atk, def, lootGold, stolen, hurt }; }

function tileDist(ax,ay,bx,by){ return Math.abs(ax-bx)+Math.abs(ay-by); }
function markSeenAround(x,y,radius){ if(!G) return; G.seen=G.seen||{};
  for(let yy=y-radius;yy<=y+radius;yy++) for(let xx=x-radius;xx<=x+radius;xx++){
    if(inMap(xx,yy)&&tileDist(x,y,xx,yy)<=radius) G.seen[xx+','+yy]=1; } }
function isSeen(x,y){ if(!G||!G.seen) return true; return !!G.seen[x+','+y]; }
function isHideoutTile(x,y){ return !!(G&&G.hideout&&G.hideout.x===x&&G.hideout.y===y); }
function hideoutNearFleet(f){ f=f||playerFleet(); return !!(f&&G&&G.hideout&&tileDist(f.x,f.y,G.hideout.x,G.hideout.y)<=1); }
function hideoutPort(){ ensureHideout();
  if(!G.hideout._port) G.hideout._port={ id:'hideout', name:G.hideout.name||'Saltkey Cove', nation:'pirate', prices:{rum:17,sugar:20,tobacco:19,spice:30}, flavor:'Your hidden cove. What you build here is yours.' };
  G.hideout._port.name=G.hideout.name||'Saltkey Cove'; return G.hideout._port; }
function revealAroundHideout(radius){ if(!G||!G.hideout) return; markSeenAround(G.hideout.x,G.hideout.y,radius); }

function claimHideout(){ ensureHideout(); if(G.hideout.claimed) return true;
  const f=playerFleet(); if(!f) return false;
  if(tileDist(f.x,f.y,G.hideout.x,G.hideout.y)>1){ toast('Sail onto the cove marker to claim it.'); return false; }
  G.hideout.claimed=true; G.hideout.claimedDay=G.day;
  revealAroundHideout(2);
  addLog('You claim <b>Saltkey Cove</b> as a hidden haven. Timber is stacked in the trees; the rest you must build.');
  toast('Saltkey Cove is yours.');
  renderAll(); return true; }

function hideoutOnPlayerTile(){ return hideoutNearFleet(playerFleet()); }

function storeGoodAtHideout(good, qty){ qty=Math.max(1,qty|0); if(!hideoutBuilt('warehouse')){ toast('Raise a warehouse first.'); return false; }
  const f=playerFleet(); const ship=f&&flagshipOf(f); if(!ship) return false;
  const have=ship.cargo[good]|0; if(have<qty){ toast('Not that much aboard.'); return false; }
  ship.cargo[good]-=qty; if(!ship.cargo[good]) delete ship.cargo[good];
  G.hideout.warehouse[good]=(G.hideout.warehouse[good]||0)+qty;
  addLog(`Stored ${qty} ${GOOD_INFO[good].name.toLowerCase()} in the cove warehouse.`); renderAll(); if(typeof renderHideout==='function') renderHideout(); return true; }
function takeGoodFromHideout(good, qty){ qty=Math.max(1,qty|0); if(!hideoutBuilt('warehouse')) return false;
  const have=G.hideout.warehouse[good]|0; if(have<qty){ toast('Not that much in the warehouse.'); return false; }
  const f=playerFleet(); const ship=f&&flagshipOf(f); if(!ship) return false;
  if(cargoUsed(ship)+qty>ship.cargoMax){ toast('No room in the hold.'); return false; }
  G.hideout.warehouse[good]-=qty; if(!G.hideout.warehouse[good]) delete G.hideout.warehouse[good];
  ship.cargo[good]=(ship.cargo[good]||0)+qty;
  addLog(`Loaded ${qty} ${GOOD_INFO[good].name.toLowerCase()} from the warehouse.`); renderAll(); if(typeof renderHideout==='function') renderHideout(); return true; }

function hideoutRepairMult(){ if(hideoutBuilt('careening')) return 0.4; if(hideoutBuilt('dock')) return 0.55; return 1; }
function hideoutCanBuildShip(defId){ return hideoutBuilt('slipway') && (defId==='sloop'||defId==='schooner'); }

function hideoutIncomeHint(){ const bits=[];
  if(hideoutBuilt('market')) bits.push('market ~3–5g/day');
  if(hideoutBuilt('smugglers')) bits.push('smugglers ~4–8g/day');
  if(hideoutBuilt('fishery')) bits.push('fishery ~2–4g/day and some fish');
  return bits.join(', ')||'no income yet'; }

function hideoutWoodFromSailing(){ // small chance to pick up timber while near islands? skip — wood comes from purchases
}
function buyTimber(n, port){ n=Math.max(1,n|0); const cost=8*n; if(G.player.gold<cost){ toast('Not enough gold.'); return false; }
  G.player.gold-=cost; G.hideout.wood=(G.hideout.wood||0)+n;
  addLog(`Bought ${n} timber for the cove (${cost} gold).`); renderAll(); if(typeof renderPort==='function') renderPort(); if(typeof renderHideout==='function') renderHideout(); return true; }


function startHideoutShip(clsId){
  if(!hideoutCanBuildShip(clsId)){ toast('The slipway can only raise a sloop or schooner.'); return false; }
  if(G.hideout.shipBuilding){ toast('A hull is already on the slip.'); return false; }
  const def=SHIP_CLASSES[clsId]; const cost=Math.round(def.cost*0.72);
  if(G.player.gold<cost){ toast('Need '+cost+' gold to lay down that hull.'); return false; }
  G.player.gold-=cost;
  G.hideout.shipBuilding={ cls:clsId, left:clsId==='sloop'?6:8, total:clsId==='sloop'?6:8, cost };
  addLog('The slipway begins a '+def.name.toLowerCase()+' ('+G.hideout.shipBuilding.left+' days, '+cost+' gold).');
  toast('Keel laid for a '+def.name.toLowerCase()+'.');
  renderAll(); if(typeof renderHideout==='function') renderHideout(); return true; }
