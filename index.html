function hashStr(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

function hexToRgb(h){ h=h.replace('#',''); if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)}; }
function rgba(h,a){ const c=hexToRgb(h); return `rgba(${c.r},${c.g},${c.b},${a})`; }
function roundRect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawOceanTile(ctx,x,y,s,tx,ty,t,time){ time=time||0;
  const n=Math.sin(tx*0.7+ty*0.45)+Math.cos(tx*1.3-ty*0.8)+Math.sin((tx+ty)*0.33);
  const deep=t===TILE_REEF?0.25:0;
  const g=ctx.createLinearGradient(x,y,x+s,y+s);
  const b=0.46+n*0.04;
  g.addColorStop(0,`rgb(${18+deep*40|0},${72+n*6+deep*20|0},${88+n*8|0})`);
  g.addColorStop(1,`rgb(${12},${58+n*5|0},${78+n*6|0})`);
  ctx.fillStyle=g; ctx.fillRect(x,y,s+0.6,s+0.6);
  ctx.strokeStyle='rgba(180,230,240,0.08)'; ctx.lineWidth=1;
  const ph=(time/1800+tx*0.4+ty*0.25);
  ctx.beginPath();
  ctx.moveTo(x+2,y+s*0.35+Math.sin(ph)*2);
  ctx.quadraticCurveTo(x+s*0.5,y+s*0.28+Math.cos(ph)*2,x+s-2,y+s*0.38+Math.sin(ph+1)*2);
  ctx.stroke();
  if(t===TILE_REEF){ ctx.fillStyle='rgba(40,90,70,0.45)';
    for(let i=0;i<5;i++){ const r=mulberry32(tx*97+ty*13+i+3); ctx.beginPath(); ctx.ellipse(x+4+r()* (s-8),y+4+r()*(s-8),2+r()*4,1.4+r()*3,r()*3,0,7); ctx.fill(); }
    ctx.fillStyle='rgba(210,170,90,0.28)'; ctx.fillRect(x+s*0.2,y+s*0.55,s*0.18,s*0.1); }
}

function drawLandTile(ctx,x,y,s,tx,ty,edge){
  const r=mulberry32(tx*131+ty*17+9);
  ctx.fillStyle='#d7c07a'; ctx.fillRect(x,y,s+0.6,s+0.6);
  if(edge){ ctx.fillStyle='#c9b36a'; ctx.fillRect(x,y,s+0.6,s+0.6); }
  const g=ctx.createRadialGradient(x+s*0.4,y+s*0.4,2,x+s*0.5,y+s*0.5,s*0.8);
  g.addColorStop(0,'#5aa54a'); g.addColorStop(1,'#2d6a32');
  ctx.fillStyle=g; ctx.fillRect(x+s*0.08,y+s*0.08,s*0.84,s*0.84);
  if(r()>0.55){ drawPalm(ctx,x+s*(0.25+r()*0.4),y+s*(0.3+r()*0.3),s*0.45,r); }
  if(r()>0.75){ ctx.fillStyle='#6b3e1a'; ctx.fillRect(x+s*0.7,y+s*0.65,s*0.08,s*0.18); }
}

function drawPalm(ctx,x,y,sc,rng){ rng=rng||Math.random;
  ctx.save(); ctx.translate(x,y); ctx.scale(sc/24,sc/24);
  ctx.strokeStyle='#6b3e1a'; ctx.lineWidth=2.4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,14); ctx.quadraticCurveTo(2,4,1,-8); ctx.stroke();
  ctx.strokeStyle='#2f8a3a'; ctx.lineWidth=1.8;
  for(const a of [-1.1,-0.4,0.3,0.95]){ ctx.beginPath(); ctx.moveTo(1,-8); ctx.quadraticCurveTo(Math.cos(a)*16,-8+Math.sin(a)*6,Math.cos(a)*18,-14+Math.sin(a)*10); ctx.stroke(); }
  ctx.restore();
}

function drawPortTile(ctx,x,y,s,port){ const nat=NATIONS[port.nation];
  drawOceanTile(ctx,x,y,s,port.x,port.y,TILE_SEA,0);
  // quay
  ctx.fillStyle='#8a6a3a'; ctx.fillRect(x+s*0.08,y+s*0.58,s*0.84,s*0.28);
  ctx.fillStyle='#c4a36a'; ctx.fillRect(x+s*0.1,y+s*0.6,s*0.8,s*0.06);
  // warehouse
  ctx.fillStyle='#6a3a22'; ctx.fillRect(x+s*0.18,y+s*0.28,s*0.34,s*0.32);
  ctx.fillStyle='#4a2414'; ctx.beginPath(); ctx.moveTo(x+s*0.14,y+s*0.28); ctx.lineTo(x+s*0.35,y+s*0.14); ctx.lineTo(x+s*0.56,y+s*0.28); ctx.fill();
  // house
  ctx.fillStyle='#d8c8a0'; ctx.fillRect(x+s*0.56,y+s*0.36,s*0.26,s*0.24);
  ctx.fillStyle=nat.color; ctx.beginPath(); ctx.moveTo(x+s*0.54,y+s*0.36); ctx.lineTo(x+s*0.69,y+s*0.22); ctx.lineTo(x+s*0.84,y+s*0.36); ctx.fill();
  drawFlag(ctx,x+s*0.78,y+s*0.12,s*0.28,nat);
}

function drawFlag(ctx,x,y,h,nat){ ctx.save();
  ctx.strokeStyle='#3a2a1a'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(x,y+h); ctx.lineTo(x,y); ctx.stroke();
  ctx.fillStyle=nat.color; ctx.fillRect(x+1,y,h*0.85,h*0.48);
  ctx.fillStyle=nat.color2; ctx.fillRect(x+1,y+h*0.24,h*0.85,h*0.24);
  if(nat.id==='pirate'){ ctx.fillStyle='#f0e6c8'; ctx.font=`bold ${Math.max(8,h*0.32)}px serif`; ctx.textAlign='center'; ctx.fillText('☠', x+1+h*0.42, y+h*0.38); }
  ctx.restore();
}

function drawShipSprite(ctx,x,y,s,ship,opt){ opt=opt||{};
  const cls=SHIP_CLASSES[ship.cls]||SHIP_CLASSES.sloop;
  const nat=NATIONS[ship.nation]||NATIONS.pirate;
  const face=opt.facing!=null?opt.facing:(ship.facing||1);
  const sunk=!!opt.sunk || (ship.hull<=0);
  ctx.save(); ctx.translate(x,y); ctx.rotate(face*Math.PI/2);
  const L=s*(0.72+cls.masts*0.06), W=s*(0.28+ (cls.id==='galleon'?0.1:0));
  // hull

// ---- 03_map.js ----
// Map generation, queries, pathfinding, wind costs
function idx(x,y){ return y*MAP_W+x; }
function inMap(x,y){ return x>=0&&y>=0&&x<MAP_W&&y<MAP_H; }
function tileAt(map,x,y){ if(!inMap(x,y)) return TILE_LAND; return map.t[idx(x,y)]; }
function walkable(map,x,y){ const t=tileAt(map,x,y); return t===TILE_SEA||t===TILE_REEF||t===TILE_PORT; }

function generateMap(seed){ const rng=mulberry32(seed||1);
  const t=new Array(MAP_W*MAP_H).fill(TILE_SEA);
  const ports=[];
  function paintIsland(cx,cy,rx,ry){ for(let y=0;y<MAP_H;y++) for(let x=0;x<MAP_W;x++){
      const dx=(x-cx)/rx, dy=(y-cy)/ry; if(dx*dx+dy*dy<=1+rng()*0.15) t[idx(x,y)]=TILE_LAND; } }
  for(const def of PORT_DEFS){ const isl=def.island||{ox:0,oy:-1,rx:2,ry:2};
    paintIsland(def.x+isl.ox, def.y+isl.oy, isl.rx, isl.ry);
    t[idx(def.x,def.y)]=TILE_PORT;
    // keep at least one adjacent sea
    let sea=0; for(const d of DIRS4){ const nx=def.x+d.x,ny=def.y+d.y; if(inMap(nx,ny)&&t[idx(nx,ny)]===TILE_SEA) sea++; }
    if(!sea){ for(const d of DIRS4){ const nx=def.x+d.x,ny=def.y+d.y; if(inMap(nx,ny)&&t[idx(nx,ny)]===TILE_LAND){ t[idx(nx,ny)]=TILE_SEA; break; } } }
    ports.push({ id:def.id, name:def.name, nation:def.nation, x:def.x, y:def.y, prices:Object.assign({},def.prices), flavor:def.flavor, mission:null });
  }
  // decorative islets
  const extras=[[12,12,2,1.4],[21,5,2,1.5],[8,11,1.6,1.2],[25,8,1.8,1.3],[16,18,2,1.2]];
  for(const [cx,cy,rx,ry] of extras) paintIsland(cx,cy,rx,ry);
  // reefs
  for(let i=0;i<28;i++){ const x=2+Math.floor(rng()*(MAP_W-4)), y=2+Math.floor(rng()*(MAP_H-4));
    if(t[idx(x,y)]===TILE_SEA){ t[idx(x,y)]=TILE_REEF; if(rng()>0.5&&inMap(x+1,y)&&t[idx(x+1,y)]===TILE_SEA) t[idx(x+1,y)]=TILE_REEF; } }
  // Saltkey Cove: keep the central islet and a sea slip on its south side
  if(inMap(12,12)) t[idx(12,12)]=TILE_LAND;
  if(inMap(12,14)) t[idx(12,14)]=TILE_SEA;
  if(inMap(11,14) && t[idx(11,14)]===TILE_LAND) t[idx(11,14)]=TILE_SEA;
  if(inMap(13,14) && t[idx(13,14)]===TILE_LAND) t[idx(13,14)]=TILE_SEA;
  // ensure all sea connected from Nassau south
  ensureConnected(t, 7, 6);
  return { w:MAP_W, h:MAP_H, t, ports };
}

function ensureConnected(t,sx,sy){ const start=idx(sx,sy); if(t[start]===TILE_LAND) t[start]=TILE_SEA;
  const seen=new Uint8Array(MAP_W*MAP_H); const q=[start]; seen[start]=1;
  while(q.length){ const i=q.pop(); const x=i%MAP_W,y=(i/MAP_W)|0;
    for(const d of DIRS4){ const nx=x+d.x,ny=y+d.y; if(!inMap(nx,ny)) continue; const j=idx(nx,ny);
      if(seen[j]) continue; if(t[j]===TILE_LAND) continue; seen[j]=1; q.push(j); } }
  // carve toward unreachable sea
  for(let y=0;y<MAP_H;y++) for(let x=0;x<MAP_W;x++){ const i=idx(x,y); if(t[i]===TILE_LAND||seen[i]) continue;
    // tunnel west or north until seen
    let cx=x,cy=y; let guard=40;
    while(guard--&&inMap(cx,cy)&&!seen[idx(cx,cy)]){ if(t[idx(cx,cy)]===TILE_LAND) t[idx(cx,cy)]=TILE_SEA; seen[idx(cx,cy)]=1;
      if(cx>sx) cx--; else if(cx<sx) cx++; else if(cy>sy) cy--; else cy++; }
  }
}

function windAlign(dx,dy,wind){ const w=DIRS8[((wind%8)+8)%8];
  const mag=Math.hypot(dx,dy)||1; const dot=(dx/mag)*w.x+(dy/mag)*w.y;
  if(dot>=0.6) return 'down'; if(dot<=-0.45) return 'up'; return 'cross'; }

function stepCost(map,x,y,nx,ny,captain,wind){ if(!walkable(map,nx,ny)) return Infinity;
  const align=windAlign(nx-x,ny-y,wind);
  let c = align==='down'?1: align==='up'?3:2;
  if(align==='up' && skillBonus(captain,'navigation')>=3) c=2;
  if(tileAt(map,nx,ny)===TILE_REEF){ if(!(captain&&(captain.perks||[]).includes('coast_pilot'))) c+=1; }
  if((captain&&(captain.perks||[]).includes('coast_pilot')) && tileAt(map,nx,ny)===TILE_SEA){
    const nearLand=DIRS4.some(d=>tileAt(map,nx+d.x,ny+d.y)===TILE_LAND||tileAt(map,nx+d.x,ny+d.y)===TILE_PORT);
    if(!nearLand) c+=0; }
  return c;
}

function findPath(map,sx,sy,tx,ty,captain,wind,maxCost){ if(!inMap(tx,ty)||!walkable(map,tx,ty)) return null;
  if(sx===tx&&sy===ty) return {path:[], cost:0};
  const cap=maxCost==null?400:maxCost;
  const key=(x,y)=>y*MAP_W+x;
  const distM=new Float64Array(MAP_W*MAP_H); distM.fill(1e9);
  const prev=new Int32Array(MAP_W*MAP_H); prev.fill(-1);
  const heap=[[0,sx,sy]]; distM[key(sx,sy)]=0;
  while(heap.length){ heap.sort((a,b)=>a[0]-b[0]); const [c,x,y]=heap.shift(); if(c!==distM[key(x,y)]) continue; if(x===tx&&y===ty) break; if(c>cap) continue;
    for(const d of DIRS4){ const nx=x+d.x,ny=y+d.y; const sc=stepCost(map,x,y,nx,ny,captain,wind); if(!isFinite(sc)) continue;
      const nc=c+sc; const k=key(nx,ny); if(nc<distM[k]){ distM[k]=nc; prev[k]=key(x,y); heap.push([nc,nx,ny]); } } }
  if(distM[key(tx,ty)]>cap) return null;
  const path=[]; let k=key(tx,ty); while(k!==key(sx,sy)&&k>=0){ path.push({x:k%MAP_W,y:(k/MAP_W)|0}); k=prev[k]; }
  path.reverse();
  return { path, cost:distM[key(tx,ty)] };
}

function tilesInRange(map,sx,sy,mp,captain,wind){ const out=new Map();
  const heap=[[0,sx,sy]]; out.set(sy*MAP_W+sx,0);
  while(heap.length){ heap.sort((a,b)=>a[0]-b[0]); const [c,x,y]=heap.shift();
    for(const d of DIRS4){ const nx=x+d.x,ny=y+d.y; const sc=stepCost(map,x,y,nx,ny,captain,wind); if(!isFinite(sc)) continue;
      const nc=c+sc; if(nc>mp) continue; const k=ny*MAP_W+nx; if(!out.has(k)||nc<out.get(k)){ out.set(k,nc); heap.push([nc,nx,ny]); } } }
  return out;
}

function portAt(x,y){ if(!G) return null; return G.map.ports.find(p=>p.x===x&&p.y===y)||null; }
function fleetAt(x,y,except){ if(!G) return null; return G.fleets.find(f=>!f.dead&&f.x===x&&f.y===y&&f!==except)||null; }
function playerFleet(){ return G&&G.fleets.find(f=>f.owner==='player'&&!f.dead)||null; }
function shipsOf(fleet){ return fleet?(fleet.ships||[]).map(id=>G.ships.find(s=>s.id===id)).filter(Boolean):[]; }
function flagshipOf(fleet){ const ss=shipsOf(fleet); return ss[0]||null; }

// ---- 04_game.js ----
// Core game state: start, sailing, days, economy helpers, encounters
let G=null;
const MAPV={ cv:null, ctx:null, cam:{x:0,y:0}, z:1, path:null, dest:null, hover:null, range:null, mouse:null, moving:false, _frameToken:0, justDragged:0, lastMove:0 };

function emptyCargo(){ const o={}; for(const g of GOODS) o[g]=0; return o; }
function cargoUsed(ship){ return GOODS.reduce((a,g)=>a+(ship.cargo[g]||0),0); }
function cargoMax(ship,captain){ const cls=SHIP_CLASSES[ship.cls]; let m=cls.cargo + (ship.upgrades.sails>0?-Math.round(cls.cargo*0.08*ship.upgrades.sails):0);
  if(captain&&(captain.perks||[]).includes('hidden_hold')) m=Math.round(m*1.2);
  if(captain&&(captain.perks||[]).includes('wind_reader') && flagshipOf(playerFleet())===ship) m=Math.round(m*0.85);
  return Math.max(6,m); }
function hullMaxOf(ship){ const cls=SHIP_CLASSES[ship.cls]; return cls.hull + ship.upgrades.hull*14; }
function sailsMaxOf(ship){ const cls=SHIP_CLASSES[ship.cls]; return cls.sails + ship.upgrades.sails*10; }
function cannonsOf(ship){ const cls=SHIP_CLASSES[ship.cls]; return cls.cannons + ship.upgrades.guns*2 + (ship.extraGuns||0); }
function crewMaxOf(ship,captain){ const cls=SHIP_CLASSES[ship.cls]; let m=cls.crewMax - ship.upgrades.guns*4 - (ship.extraGuns||0);
  if(captain&&(captain.perks||[]).includes('extra_hammocks')) m=Math.round(m*1.12);
  return Math.max(8,m); }
function shipSpeed(ship){ const cls=SHIP_CLASSES[ship.cls]; let sp=cls.speed + (ship.upgrades.sails>0? (ship.upgrades.sails>=2?1:0):0) - (ship.upgrades.hull>=2?1:0);
  const sm=sailsMaxOf(ship); if(sm>0) sp *= 0.55 + 0.45*clamp(ship.sails/sm,0,1); return Math.max(1,sp); }

function makeShip(clsId, nation, name){ const cls=SHIP_CLASSES[clsId];
  const ship={ id:uid(), cls:clsId, name:name||pick(SHIP_NAMES[nation]||SHIP_NAMES.pirate), nation,
    hull:cls.hull, sails:cls.sails, cannons:cls.cannons, range:cls.range,
    crew:Math.round(cls.crewMax*0.45), cargo:emptyCargo(), upgrades:{hull:0,sails:0,guns:0}, facing:1, gunType:'demi', extraGuns:0 };
  ship.hullMax=hullMaxOf(ship); ship.sailsMax=sailsMaxOf(ship); ship.crewMax=crewMaxOf(ship,null); ship.cargoMax=cargoMax(ship,null);
  return ship; }
function refreshShipDerived(ship,captain){ ship.hullMax=hullMaxOf(ship); ship.sailsMax=sailsMaxOf(ship); ship.cannons=cannonsOf(ship);
  const baseRange=SHIP_CLASSES[ship.cls].range + ((captain&&(captain.perks||[]).includes('long_nines'))?1:0);
  const gm=(typeof gunMult==='function')?gunMult(ship):{range:1};
  ship.range=Math.max(1, Math.round(baseRange*(gm.range||1)));
  ship.crewMax=crewMaxOf(ship,captain); ship.cargoMax=cargoMax(ship,captain);
  ship.hull=clamp(ship.hull,0,ship.hullMax); ship.sails=clamp(ship.sails,0,ship.sailsMax); ship.crew=clamp(ship.crew,0,ship.crewMax); }

function makeCaptain(name){ return { name:name||pick(CAPTAIN_NAMES), level:1, xp:0, xpNeed:xpToNext(1),
  skills:{gunnery:1,navigation:1,boarding:1,leadership:1,trade:1}, perks:[],
  morale:78, gold:850, reputation:{england:0,spain:0,france:0,netherlands:0}, marque:null, unpaid:0 }; }

function fleetSpeed(fleet){ const ss=shipsOf(fleet); if(!ss.length) return 2;
  const cap=fleet.owner==='player'?G.player:fleet.captain;
  let sp=Math.min(...ss.map(shipSpeed));
  sp += Math.floor(skillBonus(cap,'navigation')/2);
  if(cap&&(cap.perks||[]).includes('hidden_hold')) sp-=1;
  if(cap&&(cap.perks||[]).includes('coast_pilot')) sp-=1;
  if(cap&&(cap.perks||[]).includes('steady_guns')) { /* nav already reduced */ }
  return Math.max(2,Math.round(sp)); }
function fleetCrew(fleet){ return shipsOf(fleet).reduce((a,s)=>a+(s.crew||0),0); }
function restockDerived(){ if(!G) return; for(const s of G.ships) refreshShipDerived(s, G.player); }

function makeFleet(owner, nation, x, y, ships, extra){ const f=Object.assign({ id:uid(), owner, nation, x, y, ships:ships.map(s=>s.id), mp:0, mpMax:0, dead:false, role:'patrol', home:null, personality:'hunter' }, extra||{});
  for(const s of ships){ if(!G.ships.includes(s)) G.ships.push(s); }
  f.mpMax=fleetSpeed(f); f.mp=f.mpMax; return f; }

function spawnNearbySea(x,y,rng){ rng=rng||Math.random;
  for(let r=1;r<=6;r++){ const spots=[];
    for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
      if(Math.abs(dx)+Math.abs(dy)!==r) continue; const nx=x+dx,ny=y+dy; if(walkable(G.map,nx,ny)&&!portAt(nx,ny)&&!fleetAt(nx,ny)) spots.push({x:nx,y:ny}); }
    if(spots.length) return spots[Math.floor(rng()*spots.length)]; }
  const spots=[]; for(let yy=0;yy<MAP_H;yy++) for(let xx=0;xx<MAP_W;xx++) if(walkable(G.map,xx,yy)&&!portAt(xx,yy)&&!fleetAt(xx,yy)) spots.push({x:xx,y:yy});
  if(!spots.length) return {x,y}; return spots[Math.floor(rng()*spots.length)]; }

function startGame(opts){ opts=opts||{};
  closeAllModals();
  const seed=opts.seed!=null?opts.seed:(Date.now()&0x7fffffff);
  const rng=mulberry32(seed);
  const diff=opts.difficulty||'normal';
  const D=DIFF[diff]||DIFF.normal;
  G={ version:GAME_VERSION, seed, difficulty:diff, day:1, wind:2, log:[], player:makeCaptain(opts.name||'Reese'),
    ships:[], fleets:[], map:generateMap(seed), mission:null, over:false, report:[], rumours:[],
    crew:[], fallen:[], pendingSailorLevels:[], seen:{} };
  G.player.gold=D.gold; G.player.morale=D.morale;
  if(typeof ensureSupplies==='function') ensureSupplies(G);
  if(typeof ensureHideout==='function') ensureHideout(G);
  const startPort=G.map.ports.find(p=>p.id==='nassau');
  const start=spawnNearbySea(startPort.x, startPort.y, rng);
  const flag=makeShip('sloop','pirate', opts.shipName||'The Kestrel');
  flag.crew=D.crew; flag.cargo.rum=2; refreshShipDerived(flag,G.player);
  const pf=makeFleet('player','pirate', start.x, start.y, [flag], { role:'player', personality:'player' });
  G.fleets.push(pf);
  if(typeof generateStartingCrew==='function') generateStartingCrew(flag, D.crew, rng, 'pirate');
  if(typeof markSeenAround==='function'){ markSeenAround(pf.x,pf.y,SIGHT); for(const p of G.map.ports) markSeenAround(p.x,p.y,1); if(G.hideout) markSeenAround(G.hideout.x,G.hideout.y,1); }
  // easy first prize: Spanish merchant just east of the player if the sea allows
  let mpos=null;
  for(const [dx,dy] of [[2,0],[3,0],[2,1],[2,-1],[1,0],[3,1],[3,-1],[4,0],[1,1],[1,-1]]){
    const nx=start.x+dx, ny=start.y+dy;
    if(inMap(nx,ny)&&walkable(G.map,nx,ny)&&!portAt(nx,ny)&&!fleetAt(nx,ny)){ mpos={x:nx,y:ny}; break; } }
  if(!mpos) mpos=spawnNearbySea(start.x, start.y, rng);
  const merch=makeShip('sloop','spain','Santa Clara'); merch.crew=10; merch.hull=32; merch.cargo.sugar=6; merch.cargo.rum=3; refreshShipDerived(merch,null);
  G.fleets.push(makeFleet('ai','spain', mpos.x, mpos.y, [merch], { role:'merchant', home:'havana', personality:'merchant', bounty:true }));
  spawnWorldAI(rng);
  refreshAllMp();
  addLog(`${G.player.name} weighs anchor at Nassau aboard <b>${flag.name}</b>.`);
  document.getElementById('menu').classList.add('hidden');
  centerOnFleet(pf);
  MAPV.path=null; MAPV.dest=null; MAPV.range=tilesInRange(G.map,pf.x,pf.y,pf.mp,G.player,G.wind);
  renderAll();
  try{ autoSave(); }catch(e){}
  const mer=G.fleets.find(x=>x.bounty); let where='nearby';
  if(mer){ const dx=mer.x-pf.x, dy=mer.y-pf.y; if(Math.abs(dx)>=Math.abs(dy)) where=dx>=0?'east':'west'; else where=dy>=0?'south':'north'; }
  banner('The wind is from the '+windName(G.wind)+'. A fat merchant sits just '+where+' of you.', 4000);
  return G;
}

function spawnWorldAI(rng){ rng=rng||Math.random;
  const specs=[
    { nation:'england', port:'portroyal', role:'navy', cls:'brig', personality:'navy', name:'HMS Spey' },
    { nation:'spain', port:'havana', role:'navy', cls:'brig', personality:'navy', name:'San Rafael' },
    { nation:'france', port:'capfrancais', role:'navy', cls:'sloop', personality:'navy', name:'Le Renard' },
    { nation:'netherlands', port:'willemstad', role:'navy', cls:'sloop', personality:'navy', name:'De Windhond' },
    { nation:'pirate', port:'tortuga', role:'pirate', cls:'sloop', personality:'raider', name:'Black Joke', captainName:'Red Elira' },
    { nation:'spain', port:'cartagena', role:'merchant', cls:'brig', personality:'merchant', name:'Concepción' },
    { nation:'england', port:'bridgetown', role:'merchant', cls:'sloop', personality:'merchant', name:'Royal Anne' },
    { nation:'france', port:'capfrancais', role:'merchant', cls:'schooner', personality:'merchant', name:'Étoile' }
  ];
  for(const sp of specs){ const p=G.map.ports.find(x=>x.id===sp.port); if(!p) continue;
    const pos=spawnNearbySea(p.x,p.y,rng); const sh=makeShip(sp.cls, sp.nation, sp.name);
    if(sp.role==='merchant'){ sh.cargo[pick(GOODS)]=6+Math.floor(rng()*6); sh.crew=Math.round(sh.crewMax*0.4); }
    if(sp.role==='navy'){ sh.crew=Math.round(sh.crewMax*0.7); }
    refreshShipDerived(sh,null);
    const cap=sp.captainName?{ name:sp.captainName, skills:{gunnery:2,navigation:2,boarding:2,leadership:1,trade:0}, perks:[] }:null;
    G.fleets.push(makeFleet('ai', sp.nation, pos.x, pos.y, [sh], { role:sp.role, home:sp.port, personality:sp.personality, captain:cap }));
  }
}

function refreshAllMp(){ for(const f of G.fleets){ if(f.dead) continue; f.mpMax=fleetSpeed(f); f.mp=f.mpMax; } }
function repStanding(n){ if(n==='pirate') return 'haven';
  const cap=G.player; const v=cap.reputation[n]||0;
  if(cap.marque===n) return 'allied';
  if(cap.marque && NATIONS[cap.marque].rival===n) return 'hostile';
  if(v>=40) return 'friendly'; if(v>=15) return 'friendly'; if(v>-15) return 'neutral'; if(v>-40) return 'unfriendly'; return 'hostile'; }
function repLabel(s){ return ({allied:'Allied',friendly:'Friendly',neutral:'Neutral',unfriendly:'Unfriendly',hostile:'Hostile',haven:'Haven'})[s]||s; }
function adjustRep(nation, delta, silent){ if(!NATION_IDS.includes(nation)) return; G.player.reputation[nation]=clamp((G.player.reputation[nation]||0)+delta,-100,100); if(!silent) addLog(`Your name with ${NATIONS[nation].name} is now <b>${repLabel(repStanding(nation))}</b>.`); }
function canDock(port){ if(port.nation==='pirate') return true; return repStanding(port.nation)!=='hostile'; }

function viewSize(){ const dpr=MAPV.dpr||1, z=MAPV.z||1; return { w:(MAPV.cv.width/dpr)/z, h:(MAPV.cv.height/dpr)/z }; }
function centerOnFleet(f){ if(!f||!MAPV.cv) return; const v=viewSize(); MAPV.cam.x=f.x*TS - v.w/2 + TS/2; MAPV.cam.y=f.y*TS - v.h/2 + TS/2; clampCam(); }
function clampCam(){ if(!G||!MAPV.cv) return; const v=viewSize(); const vw=v.w, vh=v.h;
  MAPV.cam.x=clamp(MAPV.cam.x, -80, MAP_W*TS - vw + 80); MAPV.cam.y=clamp(MAPV.cam.y, -80, MAP_H*TS - vh + 80); }

function worldFromScreen(sx,sy){ const z=MAPV.z||1; return {x:sx/z+MAPV.cam.x, y:sy/z+MAPV.cam.y}; }
function tileFromScreen(sx,sy){ const w=worldFromScreen(sx,sy); return {x:Math.floor(w.x/TS), y:Math.floor(w.y/TS)}; }

function planSailTo(tx,ty){ const f=playerFleet(); if(!f||G.over) return null;
  if(!inMap(tx,ty)||!walkable(G.map,tx,ty)) { toast('No sea-room there.'); return null; }
  const pr=findPath(G.map,f.x,f.y,tx,ty,G.player,G.wind,80);
  if(!pr){ toast('No course through these waters.'); MAPV.path=null; MAPV.dest=null; return null; }
  MAPV.path=pr.path; MAPV.dest={x:tx,y:ty,cost:pr.cost}; return pr; }

function executeSail(){ const f=playerFleet(); if(!f||!MAPV.path||!MAPV.path.length||G.over) return false;
  const path=MAPV.path.slice();
  let steps=0;
  for(const step of path){ const cost=stepCost(G.map,f.x,f.y,step.x,step.y,G.player,G.wind);
    if(f.mp<cost){ toast('Not enough sailing left today. End the day to catch a new wind.'); break; }
    f.mp-=cost; f.x=step.x; f.y=step.y; steps++;
    if(tileAt(G.map,f.x,f.y)===TILE_REEF && !(G.player.perks||[]).includes('coast_pilot')){
      const flag=flagshipOf(f); if(flag && Math.random()<0.18){ flag.hull=Math.max(1,flag.hull-1); addLog(`${flag.name} scrapes a reef.`); } }
    const other=fleetAt(f.x,f.y,f);
    if(other){ MAPV.path=null; renderAll(); beginEncounter(other); return true; }
    const p=portAt(f.x,f.y); if(p){ MAPV.path=null; f.mp=Math.max(0,f.mp); renderAll(); dockAt(p); return true; }
    if(typeof isHideoutTile==='function'&&isHideoutTile(f.x,f.y)){ MAPV.path=null; f.mp=Math.max(0,f.mp); renderAll(); openHideout(); return true; }
    if(typeof markSeenAround==='function') markSeenAround(f.x,f.y,SIGHT);
  }
  MAPV.path=null; MAPV.dest=null;
  MAPV.range=tilesInRange(G.map,f.x,f.y,f.mp,G.player,G.wind);
  renderAll();
  if(!steps) toast('You need more wind today to sail that far.');
  return steps>0;
}

function handleMapTap(tx,ty){ if(!G||G.over) return;
  const f=playerFleet(); if(!f) return;
  hideTip();
  if(!inMap(tx,ty)) return;
  // info on land
  if(!walkable(G.map,tx,ty)){ toast('That is dry land.'); return; }
  const other=fleetAt(tx,ty,f);
  const p=portAt(tx,ty);
  if(tx===f.x&&ty===f.y){ if(p) dockAt(p); else if(typeof isHideoutTile==='function'&&(isHideoutTile(tx,ty)||hideoutNearFleet(f))) openHideout(); return; }
  if(MAPV.dest && MAPV.dest.x===tx && MAPV.dest.y===ty){ executeSail(); return; }
  const pr=planSailTo(tx,ty); if(pr){
    const hint=other?` — ${otherRoleName(other)}`:(p?` — dock at ${p.name}`:((typeof isHideoutTile==='function'&&isHideoutTile(tx,ty))?' — Saltkey Cove':''));
    toast(`Course laid (${pr.cost} wind). Tap again to sail${hint}.`);
    renderMap();
  }
}

function otherRoleName(f){ const sh=flagshipOf(f); const n=NATIONS[f.nation]; return `${n.adj} ${f.role}${sh?' “'+sh.name+'”':''}`; }

function dockAt(port){ if(!canDock(port)){ modal(`<h2>${escapeHtml(port.name)}</h2><p>The ${NATIONS[port.nation].adj} guns would open on you the moment you showed a colour. Hostile ports will not receive you.</p><div class="row"><button class="btn" id="dk-ok">Back to sea</button></div>`);
    document.getElementById('dk-ok').onclick=()=>closeAllModals(); return; }
  G.player.morale=clamp(G.player.morale+4,0,100);
  openPort(port);
}

function beginEncounter(other){ if(!other||other.dead) return;
  const you=playerFleet(); const oSh=flagshipOf(other); const n=NATIONS[other.nation];
  const stance=repStanding(other.nation);
  const html=`<h2>Sail ho!</h2>
    <p>You have sighted the <b>${escapeHtml(n.adj)} ${escapeHtml(other.role)}</b> <b>${escapeHtml(oSh?oSh.name:'stranger')}</b> (${oSh?SHIP_CLASSES[oSh.cls].name:'ship'}).</p>
    <p class="dim">${other.role==='merchant'?'A prize, if you can take her.':other.role==='navy'?'Navy colours. They will fight.':'Another rover. Trust nothing.'}
    ${other.nation!=='pirate'?` Your standing with ${n.name}: <b>${repLabel(stance)}</b>.`:''}</p>
    <div class="row">
      <button class="btn primary" id="en-fight">Fight</button>
      <button class="btn" id="en-flee">Try to flee</button>
      <button class="btn" id="en-leave">Break away</button>
    </div>`;
  const m=modal(html,'encounter');
  m.querySelector('#en-fight').onclick=()=>{ closeModal(m); beginBattle(you, other); };
  m.querySelector('#en-flee').onclick=()=>{ closeModal(m); tryFlee(you, other); };
  m.querySelector('#en-leave').onclick=()=>{ closeModal(m); nudgeOff(you, other); };
}

function nudgeOff(you, other){ // step the player back to a free neighbour so they are not stacked
  for(const d of DIRS4){ const nx=you.x+d.x,ny=you.y+d.y; if(walkable(G.map,nx,ny)&&!fleetAt(nx,ny)&&!portAt(nx,ny)){ you.x=nx; you.y=ny; break; } }
  MAPV.range=tilesInRange(G.map,you.x,you.y,you.mp,G.player,G.wind); renderAll();
}

function tryFlee(you, other){ const ys=fleetSpeed(you), os=fleetSpeed(other);
  if(ys>os || (ys===os && Math.random()<0.45)){ addLog('You show them a clean pair of heels.'); toast('You slip away.'); nudgeOff(you,other); }
  else { toast('They cut you off! Battle is joined.'); beginBattle(you, other); }
}

function goodPrice(port, good, buying){ let p=port.prices[good]||20;
  const tr=skillBonus(G.player,'trade');
  const allied=repStanding(port.nation)==='allied';
  if(buying){ p=Math.round(p*(1-tr*0.03)*(allied?0.9:1)); if((G.player.perks||[]).includes('extra_hammocks')) p=Math.round(p*1.06); }
  else { p=Math.round(p*(1+tr*0.03)*(allied?1.08:1)*(port.nation==='pirate'?0.92:1)); }
  return Math.max(4,p); }

function totalCargo(fleet){ const c=emptyCargo(); for(const s of shipsOf(fleet)) for(const g of GOODS) c[g]+=s.cargo[g]||0; return c; }
function fleetCargoFree(fleet){ const goods=shipsOf(fleet).reduce((a,s)=>a+Math.max(0,s.cargoMax-cargoUsed(s)),0); return Math.max(0, goods-(typeof supplyCargoUsed==="function"?supplyCargoUsed():0)); }
function addCargoToFleet(fleet, good, qty){ let left=qty; for(const s of shipsOf(fleet)){ const room=s.cargoMax-cargoUsed(s); const n=Math.min(room,left); if(n>0){ s.cargo[good]=(s.cargo[good]||0)+n; left-=n; } if(!left) break; } return qty-left; }
function takeCargoFromFleet(fleet, good, qty){ let left=qty; for(const s of shipsOf(fleet)){ const have=s.cargo[good]||0; const n=Math.min(have,left); if(n>0){ s.cargo[good]-=n; left-=n; } if(!left) break; } return qty-left; }

function buyGood(port, good, qty){ qty=Math.max(1,qty|0); const f=playerFleet(); const price=goodPrice(port,good,true); const free=fleetCargoFree(f);
  qty=Math.min(qty,free, Math.floor(G.player.gold/price)); if(qty<=0){ toast('You cannot buy that.'); return 0; }
  G.player.gold-=qty*price; addCargoToFleet(f,good,qty); addLog(`Bought ${qty} ${GOOD_INFO[good].name} in ${port.name} for ${qty*price} gold.`); toast(`Bought ${qty} ${GOOD_INFO[good].name}.`); renderAll(); if(typeof renderPort==='function') renderPort(); return qty; }
function sellGood(port, good, qty){ qty=Math.max(1,qty|0); const f=playerFleet(); const have=totalCargo(f)[good]||0; qty=Math.min(qty,have); if(qty<=0){ toast('You have none to sell.'); return 0; }
  const price=goodPrice(port,good,false); takeCargoFromFleet(f,good,qty); G.player.gold+=qty*price; addLog(`Sold ${qty} ${GOOD_INFO[good].name} in ${port.name} for ${qty*price} gold.`); toast(`Sold ${qty} ${GOOD_INFO[good].name}.`); renderAll(); if(typeof renderPort==='function') renderPort(); return qty; }

function recruitCrew(port, qty){ qty=Math.max(1,qty|0); const f=playerFleet(); const cap=G.player;
  const room=shipsOf(f).reduce((a,s)=>a+Math.max(0,s.crewMax-s.crew),0);
  const costEach=Math.max(8, Math.round(16*(1-skillBonus(cap,'trade')*0.03)*(port.nation==='pirate'?0.85:1)*(repStanding(port.nation)==='allied'?0.9:1)));
  qty=Math.min(qty,room,Math.floor(cap.gold/costEach)); if(qty<=0){ toast('No room, or not enough gold.'); return 0; }
  cap.gold-=qty*costEach; let left=qty; for(const s of shipsOf(f)){ const n=Math.min(left,s.crewMax-s.crew); s.crew+=n; left-=n; if(!left) break; }
  cap.morale=clamp(cap.morale+(port.nation==='pirate'?-1:1),0,100);
  addLog(`Recruited ${qty} sailors in ${port.name} for ${qty*costEach} gold.`); toast(`+${qty} crew.`); renderAll(); if(typeof renderPort==='function') renderPort(); return qty; }

function upgradeCost(ship, kind){ const rank=ship.upgrades[kind]||0; const base={hull:420,sails:380,guns:520}[kind]; return Math.round(base*(rank+1)* (SHIP_CLASSES[ship.cls].cost/900)*0.45); }
function canUpgrade(ship, kind){ return (ship.upgrades[kind]||0)<3; }
function upgradeShip(ship, kind){ if(!canUpgrade(ship,kind)){ toast('That work is already finished.'); return false; }
  const cost=upgradeCost(ship,kind); if(G.player.gold<cost){ toast('Not enough gold.'); return false; }
  G.player.gold-=cost; ship.upgrades[kind]=(ship.upgrades[kind]||0)+1;
  if(kind==='hull'){ ship.hull+=14; }
  if(kind==='sails'){ ship.sails+=10; }
  refreshShipDerived(ship,G.player);
  addLog(`The yard works ${kind} on ${ship.name}.`); toast(`${ship.name}: ${kind} improved.`); renderAll(); if(typeof renderPort==='function') renderPort(); return true; }

function signMarque(nation){ if(!NATION_IDS.includes(nation)) return false;
  if(G.player.marque===nation){ toast('You already hold their letter.'); return false; }
  const prev=G.player.marque;
  const go=()=>{ G.player.marque=nation; G.player.reputation[nation]=Math.max(G.player.reputation[nation]||0,50);
    const rival=NATIONS[nation].rival; if(rival) G.player.reputation[rival]=Math.min(G.player.reputation[rival]||0,-45);
    offerMission(nation);
    addLog(`You signed a letter of marque with <b>${NATIONS[nation].name}</b>.`);
    banner('A letter of marque — and new enemies.', 2600);
    renderAll(); if(typeof renderPort==='function') renderPort(); };
  if(prev){ const m=modal(`<h2>Break your word?</h2><p>You already fly a letter from <b>${NATIONS[prev].name}</b>. Signing with ${NATIONS[nation].name} will make ${NATIONS[prev].name} <span class="bad">Hostile</span>. This is an either-or choice — you can only hold one letter.</p>
    <div class="row"><button class="btn" id="mq-no">Keep the old letter</button><button class="btn primary" id="mq-yes">Sign with ${escapeHtml(NATIONS[nation].name)}</button></div>`);
    m.querySelector('#mq-no').onclick=()=>closeModal(m);
    m.querySelector('#mq-yes').onclick=()=>{ G.player.reputation[prev]=Math.min(G.player.reputation[prev]||0,-50); G.mission=null; closeModal(m); go(); }; return true; }
  go(); return true; }

function offerMission(nation){ const rival=NATIONS[nation].rival; const from=G.map.ports.find(p=>p.nation===nation);
  const hunt=G.fleets.find(f=>!f.dead&&f.owner==='ai'&&f.nation===rival);
  if(hunt&&from){ const sh=flagshipOf(hunt); G.mission={ type:'hunt', nation, targetId:hunt.id, targetName:sh?sh.name:'enemy', reward:400+G.player.level*80, desc:`Hunt the ${NATIONS[rival].adj} ${sh?SHIP_CLASSES[sh.cls].name+' “'+sh.name+'”':'ship'} for ${NATIONS[nation].name}.` }; }
  else { const dest=G.map.ports.find(p=>p.nation===nation&&p!==from)||from; G.mission={ type:'delivery', nation, good:'sugar', qty:6, to:dest.id, toName:dest.name, reward:280, desc:`Deliver 6 sugar to ${dest.name}.` }; }
}

function checkMissionComplete(reason, extra){ if(!G.mission) return;
  const m=G.mission;
  if(m.type==='hunt' && reason==='destroyed' && extra && extra.id===m.targetId){ completeMission(); }
  if(m.type==='delivery' && reason==='dock' && extra && extra.id===m.to){ const have=totalCargo(playerFleet())[m.good]||0; if(have>=m.qty){ takeCargoFromFleet(playerFleet(),m.good,m.qty); completeMission(); } } }
function completeMission(){ const m=G.mission; if(!m) return; G.player.gold+=m.reward; gainXP(Math.round(m.reward/4)); adjustRep(m.nation,12,true); addLog(`Mission complete. ${m.reward} gold from ${NATIONS[m.nation].name}.`); banner('Mission complete!',2200); G.mission=null; }

function gainXP(n){ if(!G||!n) return; G.player.xp+=n; let safety=6;
  while(G.player.xp>=G.player.xpNeed && safety--){ G.player.xp-=G.player.xpNeed; G.player.level++; G.player.xpNeed=xpToNext(G.player.level);
    addLog(`${G.player.name} reaches rank ${G.player.level}.`);
    pendingLevelUps=(pendingLevelUps||0)+1; }
  if(pendingLevelUps>0 && typeof openLevelUp==='function') openLevelUp(); }
let pendingLevelUps=0;

function perkChoices(captain){ const have=new Set(captain.perks||[]);
  const pool=PERKS.filter(p=>!have.has(p.id));
  const ranked=pool.slice().sort((a,b)=>{
    const sa=captain.skills[a.need]||0, sb=captain.skills[b.need]||0; return sb-sa; });
  const picks=[];
  for(const p of ranked){ if(picks.length>=3) break; if(picks.some(x=>x.need===p.need)&&picks.length>=2) continue; picks.push(p); }
  while(picks.length<2 && pool.length){ const p=pool[picks.length]; if(p&&!picks.includes(p)) picks.push(p); else break; }
  return picks.slice(0,3); }

function applyPerk(pid){ const p=PERKS.find(x=>x.id===pid); if(!p) return false;
  p.apply(G.player); if(!G.player.perks.includes(p.id)) G.player.perks.push(p.id);
  restockDerived(); pendingLevelUps=Math.max(0,pendingLevelUps-1); addLog(`Chose <b>${p.name}</b> — ${p.down}`); return true; }

function endDay(){ if(!G||G.over) return; if(typeof B!=='undefined'&&B){ toast('Finish the battle first.'); return; }
  const f=playerFleet(); const crew=fleetCrew(f); const wage=crewWage(G.player,crew);
  if(G.player.gold>=wage){ G.player.gold-=wage; G.player.unpaid=0; G.player.morale=clamp(G.player.morale+(G.player.perks||[]).includes('iron_discipline')?2:-1,0,100); }
  else { G.player.unpaid++; G.player.morale=clamp(G.player.morale-12,0,100); addLog('You cannot pay the crew. Morale falls.');
    if(G.player.morale<30 && !(G.crew&&G.crew.length)){ for(const s of shipsOf(f)){ const d=Math.min(s.crew-2, 1+Math.floor(Math.random()*3)); if(d>0){ s.crew-=d; addLog(`${d} sailors slip away from ${s.name}.`); } } } }
  // reef/sail repair at sea is slow
  for(const s of shipsOf(f)){ if(s.sails<s.sailsMax) s.sails=Math.min(s.sailsMax,s.sails+1);
    if(s.hull<s.hullMax && typeof stationScore==='function' && stationScore(s,'carpenter')>0){ s.hull=Math.min(s.hullMax,s.hull+1); if(typeof trainStation==='function') trainStation(s,'carpenter','carpenter',3); }
    if(typeof trainStation==='function'){ trainStation(s,'rigging','rigger',2); trainStation(s,'navigator','navigator',2); trainStation(s,'cook','cook',2); } }
  if(typeof consumeDailySupplies==='function') consumeDailySupplies();
  G.day++;
  if(Math.random()<0.45) G.wind=(G.wind+ (Math.random()<0.5?-1:1)+8)%8;
  const weekStart=((G.day-1)%7===0);
  addLog(`A new day. Wind from the ${windName(G.wind)}. Wages ${wage} gold.`);
  try{ runAIDay(); }catch(e){ console.error(e); }
  if(typeof dailyCrewTick==='function') dailyCrewTick(f,wage);
  if(typeof hideoutDayTick==='function') hideoutDayTick();
  if(weekStart && G.day>1) weeklyGrowth();
  refreshAllMp();
  MAPV.path=null; MAPV.dest=null;
  if(f&&!f.dead) MAPV.range=tilesInRange(G.map,f.x,f.y,f.mp,G.player,G.wind);
  try{ autoSave(); }catch(e){}
  renderAll();
  banner(`Day ${G.day} · Wind ${windName(G.wind)}`, 1600);
}

function weeklyGrowth(){ const grow=(DIFF[G.difficulty]||DIFF.normal).aiGrow;
  for(const f of G.fleets){ if(f.dead||f.owner==='player') continue;
    if(f.role==='navy' && Math.random()<0.35*grow){ const sh=flagshipOf(f); if(sh&&sh.cls==='sloop'){ upgradeShipClass(sh,'brig'); addLog(`A ${NATIONS[f.nation].adj} patrol has been reinforced.`); }
      else if(sh&&sh.cls==='brig' && G.day>21 && Math.random()<0.3*grow){ upgradeShipClass(sh,'frigate'); } }
    if(f.role==='pirate' && Math.random()<0.25*grow){ const sh=flagshipOf(f); if(sh&&CLASS_ORDER.indexOf(sh.cls)<2) upgradeShipClass(sh, CLASS_ORDER[CLASS_ORDER.indexOf(sh.cls)+1]); }
  }
  banner('A week turns. Rival captains grow bolder.', 2200); }

function upgradeShipClass(ship, newCls){ if(!SHIP_CLASSES[newCls]) return; const ratioH=ship.hull/Math.max(1,ship.hullMax), ratioS=ship.sails/Math.max(1,ship.sailsMax), ratioC=ship.crew/Math.max(1,ship.crewMax);
  ship.cls=newCls; refreshShipDerived(ship,null); ship.hull=Math.max(8,Math.round(ship.hullMax*ratioH)); ship.sails=Math.round(ship.sailsMax*ratioS); ship.crew=Math.round(ship.crewMax*Math.max(0.4,ratioC)); }

function repairFleet(port){ const f=playerFleet(); let cost=0; const jobs=[];
  for(const s of shipsOf(f)){ const hh=s.hullMax-s.hull, ss=s.sailsMax-s.sails; const c=hh*6+ss*4; if(c>0){ jobs.push({s,c,hh,ss}); cost+=c; } }
  let mult=(port&&repStanding(port.nation)==='allied'?0.8:1);
  if(port&&port.id==='hideout'&&typeof hideoutRepairMult==='function') mult*=hideoutRepairMult();
  return { cost:Math.round(cost*mult), jobs }; }
function doRepair(port){ const r=repairFleet(port); if(!r.jobs.length){ toast('Nothing needs the yard.'); return false; }
  if(G.player.gold<r.cost){ toast('Not enough gold to repair.'); return false; }
  G.player.gold-=r.cost; for(const j of r.jobs){ j.s.hull=j.s.hullMax; j.s.sails=j.s.sailsMax; }
  addLog(`Repaired the fleet at ${port.name} for ${r.cost} gold.`); toast('The fleet is patched and the sails recut.'); renderAll(); if(typeof renderPort==='function') renderPort(); return true; }

function gameOver(win, why){ if(!G||G.over) return; G.over=true; G.overWhy=why; G.overWin=!!win;
  addLog(why); try{ autoSave(); }catch(e){}
  const m=modal(`<h2>${win?'Legend of the Main':'Lost with all hands'}</h2><p>${why}</p><p class="dim">Day ${G.day}. Gold ${G.player.gold}. Rank ${G.player.level}.</p>
    <div class="row"><button class="btn primary" id="go-menu">Main menu</button><button class="btn" id="go-load">Load a save</button></div>`);
  m.querySelector('#go-menu').onclick=()=>{ closeModal(m); openMenu(); };
  m.querySelector('#go-load').onclick=()=>{ closeModal(m); openLoadMenu(); }; }

function afterBattleWorld(result, you, foe){ // result: {won, captured:[ships], sunk:[], lootGold, lootCargo}
  if(result.won){ const loot=result.lootGold||0; G.player.gold+=loot; G.player.morale=clamp(G.player.morale+8,0,100);
    if(foe.nation!=='pirate') adjustRep(foe.nation, foe.role==='navy'?-18:-12, true);
    if(G.player.marque && NATIONS[G.player.marque].rival===foe.nation) adjustRep(G.player.marque, 6, true);
    gainXP(Math.round(40+loot/8+(result.captured.length?30:0)));
    checkMissionComplete('destroyed', foe);
    foe.dead=true;
    addLog(`Victory over ${otherRoleName(foe)}. Plunder ${loot} gold.`);
    if(result.captured.length) offerCapturedShips(result.captured);
    else banner('The sea takes them. You take the gold.', 2200);
  } else {
    G.player.morale=clamp(G.player.morale-14,0,100);
    if(shipsOf(you).every(s=>s.hull<=0||((typeof crewCount==='function'?crewCount(s):s.crew)<=0))){ you.dead=true; gameOver(false,'Your last ship is lost. The wind forgets your name.'); return; }
    // flee: nudge away and maybe lose some cargo
    nudgeOff(you,foe); addLog('You break off, bloodied.');
  }
  renderAll();
}

function offerCapturedShips(list){ const f=playerFleet(); const room=MAX_FLEET-shipsOf(f).length;
  const takeOne=(ship,scuttle)=>{ if(scuttle || room<=0){ const gold=Math.round((SHIP_CLASSES[ship.cls].cost)*0.18)+80; G.player.gold+=gold; addLog(`You scuttle ${ship.name} for ${gold} gold.`); toast(`Scuttled ${ship.name} (+${gold} gold)`); }
    else { const fromNat=ship.nation; ship.nation='pirate'; ship.hull=Math.max(8,ship.hull); ship.crew=Math.max(4,Math.floor(ship.crewMax*0.25)); refreshShipDerived(ship,G.player); if(!G.ships.includes(ship)) G.ships.push(ship); if(!f.ships.includes(ship.id)) f.ships.push(ship.id); if(typeof staffPrizeShip==='function') staffPrizeShip(ship, Math.min(ship.crew, Math.max(2,Math.floor(ship.crewMax*0.15))), fromNat); addLog(`The prize ${ship.name} joins your fleet.`); toast(`${ship.name} joins your colours!`); if(typeof offerPrizeJoiners==='function') offerPrizeJoiners(fromNat); }
    restockDerived(); renderAll(); };
  if(list.length===1 && room>0){ const sh=list[0];
    const m=modal(`<h2>A prize!</h2><p>You have taken the <b>${SHIP_CLASSES[sh.cls].name} ${escapeHtml(sh.name)}</b>. Your fleet can hold ${MAX_FLEET} ships (${shipsOf(f).length} now).</p>
      <div class="row"><button class="btn primary" id="cp-take">Add to fleet</button><button class="btn" id="cp-scuttle">Scuttle for gold</button></div>`,'capture');
    m.querySelector('#cp-take').onclick=()=>{ closeModal(m); takeOne(sh,false); };
    m.querySelector('#cp-scuttle').onclick=()=>{ closeModal(m); takeOne(sh,true); };
  } else {
    // auto: fill then scuttle rest
    for(const sh of list) takeOne(sh, shipsOf(f).length>=MAX_FLEET);
  }
}

// ---- 05_combat.js ----
// Turn-based naval battle: wind, broadsides, ammo, boarding
let B=null;
const CV={ cv:null, ctx:null, z:1, panX:0, panY:0, ox:0, oy:0, cell:48, hover:null };

const BATTLE_W=10, BATTLE_H=7;

function beginBattle(youFleet, foeFleet){ if(B) return;
  const yShips=shipsOf(youFleet).filter(s=>s.hull>0&&((typeof crewCount==='function'?crewCount(s):s.crew)>0));
  const eShips=shipsOf(foeFleet).filter(s=>s.hull>0&&((typeof crewCount==='function'?crewCount(s):s.crew)>0));
  if(!yShips.length||!eShips.length){ toast('No fight in them.'); return; }
  B={ you:youFleet, foe:foeFleet, turn:'player', round:1, units:[], sel:null, ammo:'round', log:[], over:false, anim:null };
  yShips.forEach((s,i)=>B.units.push(makeBU(s,'player', 1, 2+i, 1)));
  eShips.forEach((s,i)=>B.units.push(makeBU(s,'enemy', BATTLE_W-2, 2+i, 3)));
  B.sel=B.units.find(u=>u.side==='player');
  document.getElementById('combat').classList.remove('hidden');
  document.documentElement.classList.add('combat-on');
  hideBanner();
  const toastEl=document.getElementById('toast'); if(toastEl) toastEl.classList.remove('show');
  openCombatUI();
  clog(`Battle is joined! Wind from the ${windName(G.wind)}.`);
}

function makeBU(ship, side, x, y, facing){ return { id:ship.id, ship, side, x, y, facing, mp:0, mpMax:0, reload:0, boarded:false, captured:false, sunk:false }; }
function combatSpeed(u){ const cap=u.side==='player'?G.player:(B.foe.captain||{skills:{}});
  let mp=2+Math.floor(shipSpeed(u.ship)); if((u.side==='player')&&(G.player.perks||[]).includes('long_nines')) { /* turning later */ }
  return Math.max(2, mp); }
function readyRound(){ for(const u of B.units){ if(u.sunk||u.captured) continue; u.mpMax=combatSpeed(u); u.mp=u.mpMax; u.reload=Math.max(0,u.reload-1); } }

function clog(msg){ B.log.unshift(msg); if(B.log.length>8) B.log.length=8; const el=document.getElementById('c-log'); if(el) el.innerHTML=B.log.map(x=>`<div>${x}</div>`).join(''); }

function battleCellPx(c,r){ const z=CV.z||1; const cs=CV.cell; return { x: CV.ox + (c+0.5)*cs, y: CV.oy + (r+0.5)*cs }; }
function battleAtPixel(sx,sy){ const z=CV.z||1; const dpr=CV.dpr||1; const cx=(CV.cv?CV.cv.width/dpr:0)/2, cy=(CV.cv?CV.cv.height/dpr:0)/2;
  const wx=(sx-cx)/z+cx-CV.panX, wy=(sy-cy)/z+cy-CV.panY;
  const c=Math.floor((wx-CV.ox)/CV.cell), r=Math.floor((wy-CV.oy)/CV.cell);
  if(c<0||r<0||c>=BATTLE_W||r>=BATTLE_H) return null; return {c,r}; }
function unitAt(c,r){ return B.units.find(u=>!u.sunk&&!u.captured&&u.x===c&&u.y===r)||null; }
function inBattle(c,r){ return c>=0&&r>=0&&c<BATTLE_W&&r<BATTLE_H; }

function battleTurn(dir){ const u=B.sel; if(!u||B.over||u.side!=='player') return false;
  const extra=(G.player.perks||[]).includes('long_nines')?1:0;
  const cost=1+extra; if(u.mp<cost){ toast('No movement left to turn.'); return false; }
  u.facing=((u.facing+dir)%4+4)%4; u.mp-=cost; refreshCombatUI(); return true; }
function battleForward(){ const u=B.sel; if(!u||B.over||u.side!=='player') return false;
  const d=DIRS4[u.facing]; const nx=u.x+d.x, ny=u.y+d.y;
  if(!inBattle(nx,ny)){ toast('That way lies the edge of the chart.'); return false; }
  if(unitAt(nx,ny)){ toast('Another ship occupies that water.'); return false; }
  const align=windAlign(d.x,d.y,G.wind); const cost=align==='up'?2:1;
  if(u.mp<cost){ toast(align==='up'?'Too little way on her to beat upwind.':'No movement left.'); return false; }
  u.x=nx; u.y=ny; u.mp-=cost; if(typeof trainStation==='function') trainStation(u.ship,'rigging','rigger',2); refreshCombatUI(); return true; }
function battleSetAmmo(a){ if(!AMMO[a]) return; B.ammo=a; refreshCombatUI(); }

function broadsideCells(u, which){ // which: 'port' | 'starboard'
  const left=(u.facing+3)%4, right=(u.facing+1)%4;
  const side=which==='port'?left:right;
  const d=DIRS4[side]; const cells=[];
  const range=u.ship.range||3;
  for(let i=1;i<=range;i++){ const c=u.x+d.x*i, r=u.y+d.y*i; if(!inBattle(c,r)) break; cells.push({c,r}); }
  return cells; }
function targetsInArc(u, which){ const cells=broadsideCells(u,which); const hits=[];
  for(const cell of cells){ const t=unitAt(cell.c,cell.r); if(t&&t.side!==u.side) hits.push(t); }
  return hits; }

function fireDamage(u, target, ammo){ const cap=u.side==='player'?G.player:(B&&B.foe&&B.foe.captain)||{skills:{gunnery:1,boarding:1}};
  const gun=skillBonus(cap,'gunnery');
  let dmg=(u.ship.cannons||8)*(0.32+gun*0.08);
  dmg *= 0.85+Math.random()*0.3;
  if(u.side==='player' && (G.player.perks||[]).includes('close_quarters')) dmg*=0.88;
  const sm=u.ship.sailsMax||1; dmg *= 0.75+0.25*clamp(u.ship.sails/sm,0,1);
  if(typeof gunnerySkillBonus==='function') dmg*=(1+gunnerySkillBonus(u.ship, u.side));
  const gm=typeof gunMult==='function'?gunMult(u.ship):{hull:1,sails:1,crew:1};
  if(u.side==='player' && typeof grogPenalty==='function') dmg*=(1+(grogPenalty()||0));
  if(ammo==='round'){ const hit=Math.max(2,Math.round(dmg*(gm.hull||1))); target.ship.hull=Math.max(0,target.ship.hull-hit); if(u.side==='player'&&typeof trainStation==='function') trainStation(u.ship,'guns','gunner',4); return {hit, vs:'hull'}; }
  if(ammo==='chain'){ const hit=Math.max(2,Math.round(dmg*1.25*(gm.sails||1))); target.ship.sails=Math.max(0,target.ship.sails-hit); if(u.side==='player'&&typeof trainStation==='function') trainStation(u.ship,'guns','gunner',4); return {hit, vs:'sails'}; }
  const hit=Math.max(1,Math.round(dmg*0.55*(gm.crew||1)));
  if(typeof inflictCrewHits==='function'){ const res=inflictCrewHits(target.ship,{ hits:hit, kind:'grape', numeric:hit }); if(u.side==='player'&&typeof trainStation==='function') trainStation(u.ship,'guns','gunner',5); return {hit, vs:'crew', killed:res.killed, wounded:res.wounded}; }
  target.ship.crew=Math.max(0,target.ship.crew-hit); return {hit, vs:'crew'}; }

function battleFire(which){ const u=B.sel; if(!u||B.over||u.side!=='player') return false;
  if(u.reload>0){ toast('The guns are being sponged and loaded.'); return false; }
  const tgts=targetsInArc(u, which); if(!tgts.length){ toast('No enemy in that broadside.'); return false; }
  const ammo=B.ammo||'round';
  for(const t of tgts){ const r=fireDamage(u,t,ammo); clog(`${u.ship.name} fires ${AMMO[ammo].short.toLowerCase()} — ${r.hit} to ${t.ship.name}'s ${r.vs}.`);
    if(t.ship.hull<=0) sinkUnit(t, u); }
  u.reload=1; u.mp=0; refreshCombatUI(); checkBattleEnd(); return true; }

function sinkUnit(t, by){ t.sunk=true; clog(`${t.ship.name} goes down!`); t.ship.hull=0; }

function adjacentEnemies(u){ const out=[]; for(const d of DIRS4){ const t=unitAt(u.x+d.x,u.y+d.y); if(t&&t.side!==u.side) out.push(t); } return out; }

function battleBoard(){ const u=B.sel; if(!u||B.over||u.side!=='player') return false;
  if(G.player.morale<12){ toast('The crew will not board — morale is broken.'); return false; }
  const foes=adjacentEnemies(u); if(!foes.length){ toast('Lay alongside an enemy first (move onto a hex next to them).'); return false; }
  const t=foes[0];
  const atkCap=G.player, defCap=(B.foe.captain)||{skills:{boarding:1}};
  const atkCrew=typeof boardingStrength==='function'?boardingStrength(u.ship,'player'):u.ship.crew;
  const defCrew=t.ship.crew||0;
  let atk=atkCrew*(1+skillBonus(atkCap,'boarding')*0.16)*(clamp(G.player.morale,20,100)/80);
  let def=defCrew*(1+skillBonus(defCap,'boarding')*0.16);
  if((G.player.perks||[]).includes('close_quarters')) atk*=1.25;
  const aLoss=Math.max(1,Math.round(def*0.25*(0.8+Math.random()*0.4)));
  const dLoss=Math.max(2,Math.round(atk*0.35*(0.8+Math.random()*0.4)));
  if(typeof inflictCrewHits==='function'&&typeof shipHasNamedCrew==='function'&&shipHasNamedCrew(u.ship)) inflictCrewHits(u.ship,{ hits:aLoss, kind:'boarding', numeric:aLoss, killBias:0.35 });
  else u.ship.crew=Math.max(0,u.ship.crew-aLoss);
  t.ship.crew=Math.max(0,t.ship.crew-dLoss);
  if(typeof trainStation==='function') trainStation(u.ship,'boarding','cutlass',8);
  clog(`Boarding ${t.ship.name}! You lose ${aLoss} crew, they lose ${dLoss}.`);
  if(t.ship.crew<=0 || atk>def*0.85){ t.captured=true; t.ship.crew=Math.max(2,Math.floor(t.ship.crewMax*0.15)); clog(`You take ${t.ship.name}!`); }
  else clog('They throw you back.');
  u.mp=0; refreshCombatUI(); checkBattleEnd(); return true; }

function battleEndShip(){ const u=B.sel; if(!u||B.over) return; u.mp=0; advanceBattle(); }

function living(side){ return B.units.filter(u=>u.side===side&&!u.sunk&&!u.captured); }

function checkBattleEnd(){ if(!B||B.over) return;
  const pl=living('player'), en=living('enemy');
  if(!en.length){ finishBattle(true); return; }
  if(!pl.length){ finishBattle(false); return; }
}

function advanceBattle(){ if(!B||B.over) return;
  const waiting=B.units.filter(u=>u.side==='player'&&!u.sunk&&!u.captured&&u.mp>0);
  if(waiting.length){ B.sel=waiting[0]; refreshCombatUI(); return; }
  // enemy turn
  B.turn='enemy';
  const foes=B.units.filter(u=>u.side==='enemy'&&!u.sunk&&!u.captured);
  for(const e of foes){ e.mpMax=combatSpeed(e); e.mp=e.mpMax; e.reload=Math.max(0,e.reload-1); aiBattleShip(e); if(B.over) return; }
  // next player round
  B.turn='player'; B.round++; readyRound();
  B.sel=B.units.find(u=>u.side==='player'&&!u.sunk&&!u.captured)||null;
  clog(`Round ${B.round}. Your move.`);
  refreshCombatUI(); checkBattleEnd();
}

function aiBattleShip(e){ const foes=living('player'); if(!foes.length) return;
  const role=B.foe.role;
  // merchants try to run downwind
  if(role==='merchant'){ const w=DIRS8[G.wind];
    // convert 8-dir wind to a 4-dir bias
    let face=0; if(Math.abs(w.x)>Math.abs(w.y)) face=w.x>0?1:3; else face=w.y>0?2:0;
    e.facing=face;
    for(let i=0;i<3 && e.mp>0;i++){ if(!tryBattleStep(e)) break; }
    // fire if anyone in arc
    tryAiFire(e); return; }
  // navy / pirate: close and fight
  let tgt=foes[0]; let best=1e9;
  for(const f of foes){ const d=Math.abs(f.x-e.x)+Math.abs(f.y-e.y); if(d<best){ best=d; tgt=f; } }
  // turn toward target
  const dx=Math.sign(tgt.x-e.x), dy=Math.sign(tgt.y-e.y);
  if(Math.abs(tgt.x-e.x)>=Math.abs(tgt.y-e.y) && dx) e.facing=dx>0?1:3;
  else if(dy) e.facing=dy>0?2:0;
  for(let i=0;i<4 && e.mp>0;i++){
    if(adjacentEnemies(e).length) break;
    if(!tryBattleStep(e)){
      // try a turn
      e.facing=(e.facing+1)%4; e.mp=Math.max(0,e.mp-1); }
  }
  if(adjacentEnemies(e).length && e.ship.crew>=8){ // board if they have grape advantage or crew lead
    const t=adjacentEnemies(e)[0];
    if(e.ship.crew>t.ship.crew*0.8){ B.sel=e; // reuse board math from their side
      const atk=e.ship.crew*1.1, def=t.ship.crew*(1+skillBonus(G.player,'boarding')*0.16);
      const aLoss=Math.max(1,Math.round(def*0.2)); const dLoss=Math.max(1,Math.round(atk*0.28));
      e.ship.crew=Math.max(0,e.ship.crew-aLoss);
      if(typeof inflictCrewHits==='function'&&typeof shipHasNamedCrew==='function'&&shipHasNamedCrew(t.ship)) inflictCrewHits(t.ship,{hits:dLoss,kind:'boarding',numeric:dLoss,killBias:0.35});
      else t.ship.crew=Math.max(0,t.ship.crew-dLoss);
      clog(`${e.ship.name} boards ${t.ship.name}!`);
      if(t.ship.crew<=0 || atk>def){ t.captured=true; clog(`${t.ship.name} is taken by the enemy!`); }
      checkBattleEnd(); return; }
  }
  tryAiFire(e);
}

function tryBattleStep(u){ const d=DIRS4[u.facing]; const nx=u.x+d.x, ny=u.y+d.y;
  if(!inBattle(nx,ny)||unitAt(nx,ny)) return false;
  const align=windAlign(d.x,d.y,G.wind); const cost=align==='up'?2:1;
  if(u.mp<cost) return false; u.x=nx; u.y=ny; u.mp-=cost; return true; }

function tryAiFire(e){ if(e.reload>0) return;
  for(const side of ['port','starboard']){ const tgts=targetsInArc(e,side); if(!tgts.length) continue;
    let ammo='round'; if(e.ship.crew>12) ammo='round';
    const t=tgts[0]; if(t.ship.sails>t.ship.sailsMax*0.5 && B.foe.role==='navy') ammo='chain';
    if(Math.abs(t.x-e.x)+Math.abs(t.y-e.y)<=2 && t.ship.crew>8) ammo='grape';
    const r=fireDamage(e,t,ammo); clog(`${e.ship.name} answers with ${AMMO[ammo].short.toLowerCase()} — ${r.hit} to ${t.ship.name}'s ${r.vs}.`);
    if(t.ship.hull<=0) sinkUnit(t,e);
    e.reload=1; checkBattleEnd(); return; }
}

function battleRetreat(){ if(!B||B.over) return false;
  const you=living('player')[0]; const en=living('enemy')[0];
  if(!you) return false;
  const ys=you.ship.sails/Math.max(1,you.ship.sailsMax);
  const es=en?en.ship.sails/Math.max(1,en.ship.sailsMax):0;
  if(ys+0.12<es && B.round<2){ toast('They have the weather gauge — you cannot break off yet.'); return false; }
  clog('You cut the lines and run.'); finishBattle(false); return true; }

function finishBattle(won){ if(!B||B.over) return; B.over=true;
  const captured=[], sunk=[];
  let lootGold=0; const lootCargo=emptyCargo();
  for(const u of B.units.filter(x=>x.side==='enemy')){
    if(u.captured){ captured.push(u.ship); lootGold+=80+Math.round(SHIP_CLASSES[u.ship.cls].cost*0.08); }
    else if(u.sunk){ sunk.push(u.ship); lootGold+=40+Math.round(SHIP_CLASSES[u.ship.cls].cost*0.05); }
    if(u.captured||u.sunk){ for(const g of GOODS){ lootCargo[g]+=u.ship.cargo[g]||0; u.ship.cargo[g]=0; } }
  }
  if((G.player.perks||[]).includes('no_quarter')) lootGold=Math.round(lootGold*1.25);
  // cargo into fleet
  const you=B.you, foe=B.foe;
  for(const g of GOODS){ if(lootCargo[g]) addCargoToFleet(you,g,lootCargo[g]); }
  lootGold += irnd(20,60);
  if(won && typeof gainSailorXP==='function'){ for(const s of livingPlayerCrew().filter(x=>x.shipId!=='hideout'&&x.status==='ok')) gainSailorXP(s, 8+irnd(0,6)); }
  const cas=B.casualties||{killed:[],wounded:[],saved:[]};
  // remove lost player ships
  you.ships = you.ships.filter(id=>{ const s=G.ships.find(x=>x.id===id); return s && s.hull>0 && !B.units.some(u=>u.id===id&&u.captured&&u.side==='player'); });
  foe.ships = foe.ships.filter(id=>!captured.some(s=>s.id===id) && !sunk.some(s=>s.id===id));
  const summary=`<h2>${won?'Victory':'You are beaten'}</h2>
    <p>${won?'The smoke clears and the prize is yours.':'You cut the lines and run.'}</p>
    <p>Plunder: <b>${lootGold} gold</b>${GOODS.some(g=>lootCargo[g])?' and '+GOODS.filter(g=>lootCargo[g]).map(g=>lootCargo[g]+' '+GOOD_INFO[g].name).join(', '):''}.</p>
    ${captured.length?`<p class="good">${captured.map(s=>'Took '+s.name+' ('+SHIP_CLASSES[s.cls].name+')').join('<br>')}</p>`:''}
    ${sunk.length?`<p>${sunk.map(s=>'Sank '+s.name).join('<br>')}</p>`:''}
    ${(cas.killed.length||cas.wounded.length||cas.saved.length)?`<div class="casrep"><h3>Casualties</h3>
      ${cas.killed.length?`<p class="bad">Killed: ${cas.killed.join(', ')}</p>`:''}
      ${cas.wounded.length?`<p>Wounded: ${cas.wounded.join(', ')}</p>`:''}
      ${cas.saved.length?`<p class="good">The surgeon pulled through: ${cas.saved.join(', ')}</p>`:''}</div>`:''}
    <div class="row"><button class="btn primary" id="br-ok">Continue</button></div>`;
  const youF=you, foeF=foe, res={won,captured,sunk,lootGold,lootCargo};
  const m=modal(summary,'battle-end');
  m.querySelector('#br-ok').onclick=()=>{ closeModal(m); closeCombatUI(); afterBattleWorld(res,youF,foeF); if(typeof openSailorLevelUp==='function') openSailorLevelUp(); };
}

function closeCombatUI(){ const el=document.getElementById('combat'); if(el) el.classList.add('hidden'); document.documentElement.classList.remove('combat-on'); B=null; CV.z=1; CV.panX=0; CV.panY=0; }

function layoutCombat(){ const cv=CV.cv||document.getElementById('ccv'); if(!cv) return; CV.cv=cv; CV.ctx=cv.getContext('2d');
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=cv.parentElement?cv.parentElement.clientWidth:window.innerWidth;
  const h=cv.parentElement?cv.parentElement.clientHeight:window.innerHeight;
  cv.width=Math.max(1,w*dpr); cv.height=Math.max(1,h*dpr); cv.style.width=w+'px'; cv.style.height=h+'px';
  CV.dpr=dpr;
  const padTop= (typeof MOB!=='undefined'&&MOB.phone)?110:90; const padBot=(typeof MOB!=='undefined'&&MOB.phone)?168:140;
  const aw=cv.width/dpr, ah=cv.height/dpr;
  const cell=Math.max(32, Math.min((aw-16)/BATTLE_W, (ah-padTop-padBot)/BATTLE_H));
  CV.cell=cell; CV.ox=(aw-cell*BATTLE_W)/2; CV.oy=padTop+(ah-padTop-padBot-cell*BATTLE_H)/2;
}

function shipCardHtml(u, you){ const s=u.ship; const hp=s.hullMax?s.hull/s.hullMax:0, sp=s.sailsMax?s.sails/s.sailsMax:0;
  return `<div class="cname">${escapeHtml(s.name)}</div>
    <div class="cdim">${SHIP_CLASSES[s.cls].name} · ${typeof crewCount==='function'?crewCount(s):s.crew} crew${typeof woundedSailors==='function'&&woundedSailors(s).length?` · ${woundedSailors(s).length} wounded`:''}</div>
    <div class="bar hull"><i style="width:${hp*100}%"></i></div>
    <div class="bar sails"><i style="width:${sp*100}%"></i></div>

function setupCombatInput(){ const cv=CV.cv; if(!cv||cv.dataset.cin==='1') return; cv.dataset.cin='1';
  cv.addEventListener('click',e=>{ if(!B||B.over) return; if(performance.now()<(CV.suppress||0)) return;
    const r=cv.getBoundingClientRect(); const cell=battleAtPixel(e.clientX-r.left, e.clientY-r.top); if(!cell) return;
    const u=unitAt(cell.c,cell.r);
    if(u && u.side==='player'){ B.sel=u; refreshCombatUI(); return; }
    const sel=B.sel; if(!sel||sel.side!=='player') return;
    // tap ahead to move
    const d=DIRS4[sel.facing];
    if(cell.c===sel.x+d.x && cell.r===sel.y+d.y){ battleForward(); return; }
    if(u && u.side==='enemy'){ const adj=Math.abs(u.x-sel.x)+Math.abs(u.y-sel.y)===1;
      if(adj){ battleBoard(); return; }
      if(targetsInArc(sel,'port').includes(u)){ battleFire('port'); return; }
      if(targetsInArc(sel,'starboard').includes(u)){ battleFire('starboard'); return; }
      toast('Bring them into a broadside, or lay alongside to board.'); }
  });
}

function setupCombatZoom(){ const cv=CV.cv; if(!cv||cv.dataset.cz==='1') return; cv.dataset.cz='1';
  const P=new Map(); let g=null;
  const two=()=>{ const [a,b]=[...P.values()]; return {d:Math.hypot(a.x-b.x,a.y-b.y)||1, mx:(a.x+b.x)/2, my:(a.y+b.y)/2}; };
  cv.addEventListener('pointerdown',e=>{ if(e.pointerType!=='touch') return; try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(P.size===1) g={mode:'tap',x:e.clientX,y:e.clientY,px:CV.panX,py:CV.panY};
    else if(P.size===2){ const t=two(); g={mode:'pinch',d0:t.d,z0:CV.z||1}; } },{passive:true});
  cv.addEventListener('pointermove',e=>{ if(!P.has(e.pointerId)) return; P.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(!g) return;
    if(g.mode==='tap'&&Math.hypot(e.clientX-g.x,e.clientY-g.y)>10) g.mode='pan';
    if(g.mode==='pan'){ const z=CV.z||1; CV.panX=g.px+(e.clientX-g.x)/z; CV.panY=g.py+(e.clientY-g.y)/z; CV.suppress=performance.now()+400; }
    else if(g.mode==='pinch'&&P.size>=2){ const t=two(); CV.z=Math.max(0.7,Math.min(2.4,g.z0*t.d/g.d0)); CV.suppress=performance.now()+400; } },{passive:true});
  const up=e=>{ P.delete(e.pointerId); if(P.size===0) g=null; else if(P.size===1&&g&&g.mode==='pinch'){ const [p]=[...P.values()]; g={mode:'pan',x:p.x,y:p.y,px:CV.panX,py:CV.panY}; } };
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
}

function combatFitZoom(){ CV.z=1; CV.panX=0; CV.panY=0; }
function combatWorldFromScreen(sx,sy){ const z=CV.z||1; const dpr=CV.dpr||1; const cx=(CV.cv?CV.cv.width/dpr:0)/2, cy=(CV.cv?CV.cv.height/dpr:0)/2; return {x:(sx-cx)/z+cx-CV.panX,y:(sy-cy)/z+cy-CV.panY}; }

function combatFrame(now){ if(!B||!CV.cv||!CV.ctx){ CV.raf=null; return; }
  const ctx=CV.ctx, cv=CV.cv, dpr=CV.dpr||1;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  const z=CV.z||1; const W=cv.width/dpr, H=cv.height/dpr;
  ctx.save();
  ctx.translate(W/2,H/2); ctx.scale(z,z); ctx.translate(-W/2+CV.panX,-H/2+CV.panY);
  // water
  const bg=ctx.createLinearGradient(0,0,W,H); bg.addColorStop(0,'#0b3c4c'); bg.addColorStop(1,'#0a2a36'); ctx.fillStyle=bg; ctx.fillRect(-40,-40,W+80,H+80);
  for(let r=0;r<BATTLE_H;r++) for(let c=0;c<BATTLE_W;c++){
    const x=CV.ox+c*CV.cell, y=CV.oy+r*CV.cell;
    drawOceanTile(ctx,x,y,CV.cell,c,r,TILE_SEA,now);
    ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.strokeRect(x,y,CV.cell,CV.cell);
  }
  // arcs
  const sel=B.sel;
  if(sel && sel.side==='player' && !sel.sunk){
    const d=DIRS4[sel.facing]; const fx=sel.x+d.x, fy=sel.y+d.y;
    if(inBattle(fx,fy)){ const p=battleCellPx(fx,fy); ctx.fillStyle='rgba(127,224,255,0.38)'; ctx.fillRect(p.x-CV.cell/2,p.y-CV.cell/2,CV.cell,CV.cell); }
    for(const side of ['port','starboard']) for(const cell of broadsideCells(sel,side)){
      const p=battleCellPx(cell.c,cell.r);
      const foe=unitAt(cell.c,cell.r);
      if(foe&&foe.side!==sel.side){ ctx.fillStyle='rgba(224,110,60,0.36)'; ctx.fillRect(p.x-CV.cell/2+4,p.y-CV.cell/2+4,CV.cell-8,CV.cell-8); }
      ctx.strokeStyle='rgba(224,150,90,0.9)'; ctx.lineWidth=2; ctx.setLineDash([5,4]);
      ctx.strokeRect(p.x-CV.cell/2+3,p.y-CV.cell/2+3,CV.cell-6,CV.cell-6); ctx.setLineDash([]); }
  }
  for(const u of B.units){
    const p=battleCellPx(u.x,u.y);
    if(u.sunk){ drawShipSprite(ctx,p.x,p.y,CV.cell*1.55,u.ship,{facing:u.facing,sunk:true}); continue; }
    drawShipSprite(ctx,p.x,p.y,CV.cell*1.82,u.ship,{facing:u.facing,selected:u===B.sel});
    // hp pip
    ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(p.x-16,p.y+CV.cell*0.38,32,5);
    ctx.fillStyle='#e07060'; ctx.fillRect(p.x-16,p.y+CV.cell*0.38,32*clamp(u.ship.hull/u.ship.hullMax,0,1),5);
  }
  ctx.restore();
  drawWindRose(ctx, 52, (typeof MOB!=='undefined'&&MOB.phone?90:70), 28, G?G.wind:2);
  CV.raf=requestAnimationFrame(combatFrame);
}

let _rotShown=false;
function showCombatRotHint(){ if(typeof MOB==='undefined'||!MOB.phone||MOB.land) return;
  try{ if(sessionStorage.getItem('wm_rotHint')) return; sessionStorage.setItem('wm_rotHint','1'); }catch(_){}
  const box=document.getElementById('combat'); if(!box) return;

  cv.addEventListener('mouseleave',()=>{ MAPV.hover=null; hideTip(); });
  // desktop drag
  let drag=null;
  cv.addEventListener('pointerdown',e=>{ if(e.pointerType==='touch') return; if(e.button!==0) return;
    drag={x:e.clientX,y:e.clientY,cx:MAPV.cam.x,cy:MAPV.cam.y,moved:false}; try{ cv.setPointerCapture(e.pointerId); }catch(_){} });
  cv.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(Math.hypot(dx,dy)>6) drag.moved=true;
    if(drag.moved){ MAPV.cam.x=drag.cx-dx/(MAPV.z||1); MAPV.cam.y=drag.cy-dy/(MAPV.z||1); clampCam(); MAPV.lastMove=performance.now(); } });
  cv.addEventListener('pointerup',e=>{ if(drag&&drag.moved) MAPV.justDragged=performance.now(); drag=null; });
  cv.addEventListener('wheel',e=>{ e.preventDefault(); const f=e.deltaY<0?1.1:1/1.1; const r=cv.getBoundingClientRect();
    const wx=(e.clientX-r.left)/(MAPV.z||1)+MAPV.cam.x, wy=(e.clientY-r.top)/(MAPV.z||1)+MAPV.cam.y;
    MAPV.z=clamp((MAPV.z||1)*f,0.6,2.2); MAPV.cam.x=wx-(e.clientX-r.left)/MAPV.z; MAPV.cam.y=wy-(e.clientY-r.top)/MAPV.z; clampCam(); prefSet('wm_mapzoom',String(MAPV.z)); },{passive:false});
}

function renderMap(time){ const cv=MAPV.cv, ctx=MAPV.ctx; if(!cv||!ctx) return;
  const dpr=MAPV.dpr||1; ctx.setTransform(dpr,0,0,dpr,0,0);
  const W=cv.width/dpr, H=cv.height/dpr;
  ctx.fillStyle='#082028'; ctx.fillRect(0,0,W,H);
  if(!G){ ctx.fillStyle='#e8c36a'; ctx.font='28px Georgia'; ctx.textAlign='center'; ctx.fillText(GAME_TITLE,W/2,H/2); return; }
  const z=MAPV.z||1; ctx.save(); ctx.scale(z,z); ctx.translate(-MAPV.cam.x,-MAPV.cam.y);
  const x0=Math.max(0,Math.floor(MAPV.cam.x/TS)-1), y0=Math.max(0,Math.floor(MAPV.cam.y/TS)-1);
  const x1=Math.min(MAP_W, Math.ceil((MAPV.cam.x+W/z)/TS)+1), y1=Math.min(MAP_H, Math.ceil((MAPV.cam.y+H/z)/TS)+1);
  for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){
    const t=tileAt(G.map,x,y); const px=x*TS, py=y*TS;
    if(t===TILE_LAND){ const edge=DIRS4.some(d=>walkable(G.map,x+d.x,y+d.y)); drawLandTile(ctx,px,py,TS,x,y,edge); }
    else if(t===TILE_PORT){ const p=portAt(x,y); if(p) drawPortTile(ctx,px,py,TS,p); else drawOceanTile(ctx,px,py,TS,x,y,TILE_SEA,time); }
    else if(typeof isHideoutTile==='function'&&isHideoutTile(x,y)&&typeof drawHideoutMarker==='function') drawHideoutMarker(ctx,px,py,TS,G.hideout);
    else drawOceanTile(ctx,px,py,TS,x,y,t,time);
    if(typeof isSeen==='function'&&!isSeen(x,y)){ ctx.fillStyle='rgba(4,14,20,0.5)'; ctx.fillRect(px,py,TS+0.6,TS+0.6); }
  }
  // range
  if(MAPV.range){ ctx.fillStyle='rgba(127,224,255,0.16)';
    for(const [k] of MAPV.range){ const x=k%MAP_W,y=(k/MAP_W)|0; ctx.fillRect(x*TS,y*TS,TS,TS); } }
  if(MAPV.path){ ctx.strokeStyle='rgba(255,224,140,0.85)'; ctx.lineWidth=3; ctx.beginPath();
    const f=playerFleet(); if(f) ctx.moveTo(f.x*TS+TS/2,f.y*TS+TS/2);
    for(const p of MAPV.path) ctx.lineTo(p.x*TS+TS/2,p.y*TS+TS/2); ctx.stroke();
    if(MAPV.dest){ ctx.fillStyle='rgba(255,224,140,0.35)'; ctx.fillRect(MAPV.dest.x*TS,MAPV.dest.y*TS,TS,TS); } }
  // fleets
  for(const fl of G.fleets){ if(fl.dead) continue; if(fl.x<x0-1||fl.y<y0-1||fl.x>x1||fl.y>y1) continue;
    if(typeof isSeen==='function'&&!isSeen(fl.x,fl.y)&&fl.owner!=='player') continue;
    const sh=flagshipOf(fl); if(!sh) continue;
    const px=fl.x*TS+TS/2, py=fl.y*TS+TS/2;
    drawShipSprite(ctx,px,py,TS*1.32,sh,{facing:sh.facing||1,selected:fl.owner==='player'});
    if(fl.owner==='player'){ ctx.strokeStyle='#ffe08a'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(px,py,TS*0.42,0,7); ctx.stroke(); }
  }
  // port names + hideout label
  ctx.font='bold 11px Georgia'; ctx.textAlign='center'; ctx.textBaseline='top';
  for(const p of G.map.ports){ if(p.x<x0||p.y<y0||p.x>x1||p.y>y1) continue;
    ctx.fillStyle='rgba(8,20,24,0.65)'; ctx.fillRect(p.x*TS+4,p.y*TS+TS-2,TS-8,13);
    ctx.fillStyle='#f3ead4'; ctx.fillText(p.name, p.x*TS+TS/2, p.y*TS+TS-2); }
  if(G.hideout){ const hx=G.hideout.x, hy=G.hideout.y;
    if(hx>=x0&&hy>=y0&&hx<=x1&&hy<=y1){ ctx.fillStyle='rgba(8,20,24,0.65)'; ctx.fillRect(hx*TS+2,hy*TS+TS-2,TS-4,13);
      ctx.fillStyle='#c9f0d0'; ctx.fillText(G.hideout.claimed?(G.hideout.name||'Cove'):'Cove?', hx*TS+TS/2, hy*TS+TS-2); } }
  ctx.restore();
  drawWindRose(ctx, 48, 52, 30, G.wind);
}

function renderMinimap(){ const cv=document.getElementById('minimap'); if(!cv||!G) return; const ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height; ctx.fillStyle='#061418'; ctx.fillRect(0,0,W,H);
  const sx=W/MAP_W, sy=H/MAP_H;
  for(let y=0;y<MAP_H;y++) for(let x=0;x<MAP_W;x++){ const t=tileAt(G.map,x,y);
    ctx.fillStyle=t===TILE_LAND?'#3a8a40':t===TILE_REEF?'#2a6a58':t===TILE_PORT?'#e8c36a':'#1a4a58';
    ctx.fillRect(x*sx,y*sy,sx+0.4,sy+0.4); }
  for(const fl of G.fleets){ if(fl.dead) continue; ctx.fillStyle=fl.owner==='player'?'#ffe08a':(NATIONS[fl.nation].color);
    ctx.fillRect(fl.x*sx,fl.y*sy,Math.max(3,sx),Math.max(3,sy)); }
  if(!cv.dataset.mm){ cv.dataset.mm='1'; cv.addEventListener('click',e=>{ const r=cv.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*MAP_W, y=(e.clientY-r.top)/r.height*MAP_H;
    MAPV.cam.x=x*TS-(MAPV.cv.width/(MAPV.dpr||1)/(MAPV.z||1))/2; MAPV.cam.y=y*TS-(MAPV.cv.height/(MAPV.dpr||1)/(MAPV.z||1))/2; clampCam(); renderMap(); }); }
}

function openHelp(){ modal(`<h2>How to play ${GAME_TITLE}</h2>
  <div class="help">
    <h3>The map</h3>
    <p>You captain a fleet on a Caribbean sea. Each day you have a limited amount of sailing, shown as “wind” or movement. Sailing <b>with</b> the wind (see the compass rose) is cheap; beating <b>upwind</b> costs more. Reefs cost extra and may scrape the hull.</p>
    <p>Tap a sea hex to lay a course, then tap it again (or tap <b>Sail</b>) to go. Moving onto a port docks you. Moving onto another ship starts a meeting — fight or try to flee.</p>
    <h3>Ports</h3>
    <p>Four nations keep ports: England, Spain, France and the Netherlands, plus pirate havens that will take anyone. In port you can trade goods (prices differ by town — buy cheap, sell dear), recruit sailors, repair and upgrade ships, and sign a letter of marque.</p>
    <h3>A letter of marque</h3>
    <p>You may hold a letter from <b>one</b> nation. That nation becomes Allied (better prices and a mission). Their rival becomes Hostile and will not let you dock — and their navy will hunt you. You can break a letter later, but the old friends will not forgive it.</p>
    <h3>Battle</h3>
    <p>Fights are turn-based on a sea grid. Your ship faces a direction. <b>Sail</b> moves one hex that way (upwind costs 2). <b>Turn</b> changes facing. Cannons fire in <b>broadsides</b> — to the left (port) or right (starboard), not out of the bow.</p>
    <p>Choose shot: <b>Round</b> smashes hulls (sink them), <b>Chain</b> rips sails (they cannot run), <b>Grape</b> cuts down crew (makes boarding easier). Lay alongside and <b>Board</b> to capture a ship and add it to your fleet (up to three).</p>
    <h3>Your captain</h3>
    <p>Win fights and finish missions to gain experience. Each rank you pick a skill with a real downside — you cannot have everything. The five crafts are Gunnery, Navigation, Boarding, Leadership and Trade.</p>
    <h3>The crew</h3>
    <p>Every sailor is a unique person with a name, a face, rolled Strength, Agility, Wits, Nerve and Constitution, and sometimes a starting skill. Better rolls and rare skills cost more to sign and more in daily wages. Cheap hands are still useful. They learn on the job — gunners at the guns, surgeons over the wounded — and rank up like a small hero, sometimes choosing a craft with a real downside. You can let the game pick those crafts for you so a large company is not tedious.</p>
    <p>If they die they are gone for good. Grape and boarding are the dangerous moments. A skilled surgeon can pull someone back from the brink; the wounded recover over days, faster with a surgeon or in the hideout infirmary. Use <b>Protect / reserve</b> and leave favourites at the hideout before a hard fight. After a battle you will see who was hurt, killed, or saved.</p>
    <h3>Provisions and spending</h3>
    <p>Gold also goes into hulls, sails, extra guns, culverins or carronades, cutlasses and muskets, paid training in port, and stores. Food and water are eaten every day at sea and take hold space that could have carried trade goods. Use <b>Top up for 7 / 14 days</b> on the Outfitting tab. The map shows how many days of stores you have left. Ale keeps morale up — too little and people desert, too much and they get sloppy.</p>
    <h3>Your hideout</h3>
    <p><b>Saltkey Cove</b> is marked on the map. Sail onto it to claim a hidden haven. Buildings take gold, timber and days. Several are either-or choices: a careening yard or a slipway, an armory or a foundry, a lookout tower or a hidden channel, smugglers or a fishery. You cannot eventually have everything. Crew left at the cove are safe from battle and can train or heal. A weakly defended cove may later draw a raid.</p>
    <h3>Saving</h3>
    <p>The game autosaves every day. Use Save, Load, and Export / Import to keep a backup file. Updates will not wipe a save. Preferences (layout, text size, zoom) can always be put back with <b>Reset to phone defaults</b> in the ☰ menu — that never touches saves.</p>
  </div>
  <div class="row"><button class="btn primary" id="hp-ok">Got it</button></div>`,'help wide');
  document.getElementById('hp-ok').onclick=()=>closeAllModals(); }
